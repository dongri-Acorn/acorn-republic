<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D ヒューマン・サンドボックス 〜どんぐりの森 オンライン〜</title>
<style>
:root{--ui-bg:rgba(20,24,38,.65);--ui-fg:#eef1ff;--ui-sub:#aab3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#0d1020;color:var(--ui-fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--ui-bg);backdrop-filter:blur(6px);padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;pointer-events:none;transition:opacity .25s, transform .25s;z-index:10}
#hud.hidden{opacity:0;transform:translateY(-10px);pointer-events:none}
#hud b{color:#fff}#hud small{color:var(--ui-sub)}
#acorns{color:#ffcf5c;font-weight:bold}
#onlineCount{color:#7dffa8;font-weight:bold}
#topRight{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px;z-index:20}
#topRight button{background:var(--ui-bg);color:var(--ui-fg);border:0;border-radius:10px;padding:8px 12px;font-size:12px;backdrop-filter:blur(6px);cursor:pointer}
#stick{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:120px;height:120px;border-radius:50%;background:var(--ui-bg);touch-action:none;display:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#8fa2ff}
#jump{position:fixed;right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:84px;height:84px;border-radius:50%;border:0;background:var(--ui-bg);color:var(--ui-fg);font-size:15px;touch-action:none;display:none}
#actions{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);display:flex;flex-direction:column;gap:10px;z-index:15}
#actions button{width:64px;height:64px;border-radius:50%;border:0;background:var(--ui-bg);color:var(--ui-fg);font-size:12px;touch-action:none;backdrop-filter:blur(6px);cursor:pointer}
#actions button:active{background:rgba(80,100,160,.8)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);background:rgba(20,24,38,.92);backdrop-filter:blur(10px);padding:18px;border-radius:18px;max-width:92vw;max-height:85vh;overflow:auto;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:40;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.panel h3{margin:0 0 12px;font-size:15px;color:#fff}
.panel .close{position:absolute;right:12px;top:12px;background:transparent;border:0;color:var(--ui-sub);font-size:20px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px;flex-wrap:wrap}
.row label{min-width:72px;color:var(--ui-sub)}
.row input[type="color"]{width:40px;height:32px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.optGroup{display:flex;gap:8px;flex-wrap:wrap}
.optGroup button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--ui-fg);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
.optGroup button.active{background:#8fa2ff;color:#0d1020;border-color:#8fa2ff;font-weight:bold}
#chatInputBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);width:min(560px,92vw);display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:45}
#chatInputBar.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#chatInputBar input{flex:1;border:0;border-radius:12px;padding:12px 14px;background:rgba(20,24,38,.92);color:#fff;font-size:15px;backdrop-filter:blur(8px);outline:none}
#chatInputBar button{border:0;border-radius:12px;padding:12px 18px;background:#8fa2ff;color:#0d1020;font-weight:bold;font-size:14px;cursor:pointer}
.bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#222;padding:8px 12px;border-radius:14px;font-size:14px;max-width:240px;word-break:break-word;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;z-index:35;transition:opacity .3s;white-space:pre-wrap;line-height:1.4}
.bubble:after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff}
.bubble.fade{opacity:0}
.bubble .name{font-size:11px;color:#666;margin-bottom:2px}
#emotePanel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%) translateY(20px);background:rgba(20,24,38,.85);backdrop-filter:blur(8px);padding:14px 16px;border-radius:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:25}
#emotePanel.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#emotePanel .title{width:100%;text-align:center;font-size:12px;color:var(--ui-sub);margin-bottom:2px}
#emotePanel button{border:0;border-radius:12px;padding:10px 14px;background:rgba(60,70,110,.9);color:var(--ui-fg);font-size:13px;cursor:pointer;white-space:nowrap}
#emotePanel button:active{background:rgba(90,110,180,.95)}
#emotePanel button .emoji{font-size:18px;margin-right:6px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,40,20,.8);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
@media (pointer:coarse){#stick,#jump{display:block}#hud .pc{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>どんぐりの森 オンライン</b><br>
<span class="pc"><small>WASD/矢印：移動　Shift：走る　Space：ジャンプ<br>ドラッグ：視点　C：あぐら　E：エモート　T：チャット</small></span>
<span id="pos"></span><br>
🌰 <span id="acorns">0</span>/<span id="acornTotal">0</span>　
🟢 オンライン：<span id="onlineCount">1</span>人
</div>
<div id="topRight">
  <button id="uiToggle">UI 非表示</button>
  <button id="customBtn">カスタマイズ</button>
</div>
<div id="actions">
  <button id="sitBtn">あぐら</button>
  <button id="emoteBtn">エモート</button>
  <button id="chatBtn">チャット</button>
</div>

<div class="panel" id="customPanel">
  <button class="close" data-close="customPanel">×</button>
  <h3>キャラクターカスタマイズ</h3>
  <div class="row"><label>髪型</label>
    <div class="optGroup" id="hairOpts">
      <button data-hair="short">ショート</button><button data-hair="long">ロング</button><button data-hair="twin">ツインテール</button><button data-hair="bob">ボブ</button><button data-hair="bald">ハゲ</button>
    </div>
  </div>
  <div class="row"><label>髪の色</label><input type="color" id="hairColor" value="#2a1d16"></div>
  <div class="row"><label>肌の色</label><input type="color" id="skinColor" value="#b97a4b"></div>
  <div class="row"><label>服の色</label><input type="color" id="shirtColor" value="#1b2a5c"></div>
  <div class="row"><label>靴下の色</label><input type="color" id="sockColor" value="#f5f5f5"></div>
  <div class="row"><label>目の色</label><input type="color" id="eyeColor" value="#111111"></div>
  <div class="row"><label>目の形</label>
    <div class="optGroup" id="eyeShapeOpts">
      <button data-eye="round">丸</button><button data-eye="happy">笑顔</button><button data-eye="sharp">キリッ</button><button data-eye="closed">閉じ</button>
    </div>
  </div>
  <div class="row"><label>口</label>
    <div class="optGroup" id="mouthOpts">
      <button data-mouth="smile">スマイル</button><button data-mouth="open">開口</button><button data-mouth="neutral">普通</button><button data-mouth="cat">ω</button>
    </div>
  </div>
</div>

<div id="emotePanel">
  <div class="title">エモートを選択</div>
  <button data-emote="wave"><span class="emoji">👋</span>手を振る</button>
  <button data-emote="cheer"><span class="emoji">🙌</span>喜ぶ</button>
  <button data-emote="dance"><span class="emoji">💃</span>踊る</button>
  <button data-emote="think"><span class="emoji">🤔</span>考える</button>
  <button data-emote="stretch"><span class="emoji">🙆</span>伸びをする</button>
</div>

<div id="chatInputBar">
  <input id="chatInput" type="text" maxlength="120" placeholder="メッセージを入力…">
  <button id="chatSend">送信</button>
</div>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<button id="jump">ジャンプ</button>

<!-- Firebase SDK (compat版: 既存コードと親和性が高い) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// ★ Firebase 設定 ★
// Firebase Console → プロジェクトの設定 → マイアプリ から取得
// ============================================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============================================================
// プレイヤーID（セッションごとに一意）
// ============================================================
const PLAYER_ID = 'p_' + Math.random().toString(36).slice(2, 10);
let playerName = 'ゲスト';

// ============================================================
// Three.js 初期化（既存コードと同じ）
// ============================================================
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfe3ff);
scene.fog=new THREE.Fog(0xbfe3ff,60,220);
const camera=new THREE.PerspectiveCamera(60,1,0.1,400);

scene.add(new THREE.HemisphereLight(0xcfe8ff,0x6b8f4e,1.05));
const sun=new THREE.DirectionalLight(0xfff6df,1.25);
sun.position.set(30,40,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:120});
sun.shadow.bias=-0.0005;
scene.add(sun,sun.target);
scene.add(new THREE.AmbientLight(0xffffff,0.25));

// 地面
const groundGeo=new THREE.PlaneGeometry(600,600,60,60);
groundGeo.rotateX(-Math.PI/2);
const gpos=groundGeo.attributes.position;
for(let i=0;i<gpos.count;i++){
  const x=gpos.getX(i),z=gpos.getZ(i);
  const d=Math.hypot(x,z);
  const h=(Math.sin(x*0.05)*Math.cos(z*0.05)*1.6 + Math.sin(x*0.15+z*0.1)*0.4)*Math.min(1,Math.max(0,(d-15)/40));
  gpos.setY(i,h);
}
groundGeo.computeVertexNormals();
const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({color:0x6fae4a,roughness:1}));
ground.receiveShadow=true;scene.add(ground);

// 草
(function addGrassField(){
  const g=new THREE.BufferGeometry();
  const N=4000,arr=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2,r=18+Math.random()*140;
    arr[i*3]=Math.cos(a)*r;arr[i*3+1]=0.05;arr[i*3+2]=Math.sin(a)*r;
  }
  g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const m=new THREE.PointsMaterial({color:0x4f8f35,size:0.5,sizeAttenuation:true,transparent:true,opacity:0.8});
  const p=new THREE.Points(g,m);p.position.y=0.02;scene.add(p);
})();

const grid=new THREE.GridHelper(600,300,0x8fbf6a,0x7aa85a);
grid.position.y=0.02;grid.material.opacity=0.25;grid.material.transparent=true;scene.add(grid);

// 木・景観（省略なし）
function makeTree(x,z,scale=1){
  const g=new THREE.Group();g.position.set(x,0,z);
  const trunkH=2.2*scale;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.16*scale,0.24*scale,trunkH,7),new THREE.MeshStandardMaterial({color:0x6b4a2f,roughness:1}));
  trunk.position.y=trunkH/2;trunk.castShadow=true;trunk.receiveShadow=true;g.add(trunk);
  const mats=[
    new THREE.MeshStandardMaterial({color:0x3f8f3a,roughness:0.9}),
    new THREE.MeshStandardMaterial({color:0x4fa64a,roughness:0.9}),
    new THREE.MeshStandardMaterial({color:0x5fbf55,roughness:0.9}),
  ];
  [[0,trunkH+0.7*scale,0,1.1*scale],[0.7*scale,trunkH+0.4*scale,0.4*scale,0.8*scale],[-0.6*scale,trunkH+0.5*scale,-0.5*scale,0.85*scale],[0.2*scale,trunkH+1.2*scale,-0.3*scale,0.7*scale]].forEach((b,i)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(b[3],10,8),mats[i%3]);
    m.position.set(b[0],b[1],b[2]);m.castShadow=true;m.receiveShadow=true;g.add(m);
  });
  scene.add(g);return g;
}
function makeOakTree(x,z,scale=1){
  const g=makeTree(x,z,scale);
  const acornCapMat=new THREE.MeshStandardMaterial({color:0x7a5230,roughness:0.9});
  const acornBodyMat=new THREE.MeshStandardMaterial({color:0xc68b3c,roughness:0.8});
  for(let i=0;i<5;i++){
    const a=Math.random()*Math.PI*2,r=(0.6+Math.random()*0.6)*scale;
    const acorn=new THREE.Group();
    acorn.position.set(Math.cos(a)*r,2.8*scale+Math.random()*0.5,Math.sin(a)*r);
    const body=new THREE.Mesh(new THREE.SphereGeometry(0.12*scale,8,6),acornBodyMat);
    body.scale.y=1.3;body.position.y=-0.08*scale;acorn.add(body);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.13*scale,8,6,0,Math.PI*2,0,Math.PI*0.5),acornCapMat);
    cap.position.y=0.03*scale;acorn.add(cap);
    g.add(acorn);
  }
  return g;
}
function makeBush(x,z,scale=1){
  const g=new THREE.Group();g.position.set(x,0,z);
  const mat=new THREE.MeshStandardMaterial({color:0x4f9f45,roughness:1});
  for(let i=0;i<4;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry((0.35+Math.random()*0.25)*scale,8,6),mat);
    m.position.set((Math.random()-0.5)*0.8*scale,0.35*scale,(Math.random()-0.5)*0.8*scale);
    m.castShadow=true;m.receiveShadow=true;g.add(m);
  }
  scene.add(g);return g;
}
function makeFlowerPatch(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  const colors=[0xff6b8a,0xffd166,0xffffff,0xb388ff,0xff9f68];
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2,r=Math.random()*1.6;
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.35,4),new THREE.MeshStandardMaterial({color:0x3f8f3a}));
    stem.position.set(Math.cos(a)*r,0.17,Math.sin(a)*r);g.add(stem);
    const petal=new THREE.Mesh(new THREE.SphereGeometry(0.09,6,5),new THREE.MeshStandardMaterial({color:colors[i%colors.length],roughness:0.7}));
    petal.position.set(Math.cos(a)*r,0.38,Math.sin(a)*r);g.add(petal);
  }
  scene.add(g);return g;
}
function makeRock(x,z,s=1){
  const m=new THREE.Mesh(new THREE.DodecahedronGeometry(0.6*s,0),new THREE.MeshStandardMaterial({color:0x9a9a92,roughness:1}));
  m.position.set(x,0.3*s,z);m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  m.scale.y=0.7;m.castShadow=true;m.receiveShadow=true;scene.add(m);
}
function makeHill(x,z,r,h){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,10,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x5f9f4f,roughness:1}));
  m.position.set(x,-r+h,z);m.scale.y=h/r;m.receiveShadow=true;scene.add(m);
}

const FOREST_CENTER = new THREE.Vector3(-22, 0, 18);
for(let i=0;i<24;i++){
  const a=(i/24)*Math.PI*2;const r=10+Math.sin(i*1.7)*2.5;
  makeOakTree(FOREST_CENTER.x+Math.cos(a)*r,FOREST_CENTER.z+Math.sin(a)*r,1.0+Math.random()*0.5);
}
for(let i=0;i<10;i++){
  const a=Math.random()*Math.PI*2,r=Math.random()*7;
  makeOakTree(FOREST_CENTER.x+Math.cos(a)*r,FOREST_CENTER.z+Math.sin(a)*r,0.9+Math.random()*0.4);
}
[[-16,-6,1.3],[-20,4,1.1],[-13,12,1.0],[-24,-14,1.5],[-10,-20,1.2],[16,10,1.2],[22,-2,1.4],[18,-18,1.1],[26,12,1.3],[30,-12,1.5],[-4,-22,1.1],[8,16,1.0],[-28,20,1.4],[36,4,1.6],[-32,-8,1.2],[2,6,1.0],[-2,-6,1.1],[14,4,1.2],[-6,10,1.0]].forEach(([x,z,s])=>makeTree(x,z,s));
[[-6,6,1],[10,4,1.2],[14,-4,1],[-14,-2,1.1],[4,-16,1],[20,2,1.3],[-18,14,1.1],[28,-4,1.2],[0,10,1],[6,10,1]].forEach(([x,z,s])=>makeBush(x,z,s));
[[-8,2],[-3,8],[9,8],[-12,-8],[12,-12],[-2,-10],[18,6],[-20,2],[6,14],[-16,-16],[0,-14],[2,2],[10,10],[-9,15]].forEach(([x,z])=>makeFlowerPatch(x,z));
[[-10,10,1],[15,-8,1.3],[24,4,0.9],[-18,-4,1.1],[8,-14,1],[-6,-16,0.8],[12,16,1.2],[-4,4,0.8]].forEach(([x,z,s])=>makeRock(x,z,s));
makeHill(-70,-60,35,18);makeHill(70,-80,45,22);makeHill(-80,60,40,16);makeHill(90,50,50,20);makeHill(0,-120,60,26);

// ========== 妖精（オンライン同期なし・ローカルのみ） ==========
const fairyPositions=[
  [FOREST_CENTER.x+3, 0, FOREST_CENTER.z+2],[FOREST_CENTER.x-4, 0, FOREST_CENTER.z-3],
  [FOREST_CENTER.x+5, 0, FOREST_CENTER.z-4],[FOREST_CENTER.x-5, 0, FOREST_CENTER.z+5],
  [FOREST_CENTER.x+1, 0, FOREST_CENTER.z-6],[8, 0, 6],[-8, 0, -8],[14, 0, -12],[-14, 0, 10],[0, 0, -12],[18, 0, 12],
];
const fairies=[];
const acornGroup=new THREE.Group();scene.add(acornGroup);
function makeFairy(id,x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  const bodyMat=new THREE.MeshStandardMaterial({color:0xd9a44a,roughness:0.6,emissive:0x553311,emissiveIntensity:0.15});
  const capMat=new THREE.MeshStandardMaterial({color:0x7a5230,roughness:0.9});
  const bodyMesh=new THREE.Mesh(new THREE.SphereGeometry(0.28,12,10),bodyMat);
  bodyMesh.scale.y=1.3;bodyMesh.position.y=0.5;bodyMesh.castShadow=true;g.add(bodyMesh);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.3,12,8,0,Math.PI*2,0,Math.PI*0.55),capMat);
  cap.position.y=0.7;cap.castShadow=true;g.add(cap);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.12,5),capMat);stem.position.y=0.9;g.add(stem);
  const eyeMat=new THREE.MeshBasicMaterial({color:0x111111});
  for(const s of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6),eyeMat);eye.position.set(s*0.1,0.52,0.24);g.add(eye);}
  const cheekMat=new THREE.MeshBasicMaterial({color:0xff8f9f});
  for(const s of [-1,1]){const cheek=new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6),cheekMat);cheek.position.set(s*0.16,0.44,0.2);g.add(cheek);}
  const wingMat=new THREE.MeshStandardMaterial({color:0xbfe8ff,transparent:true,opacity:0.6,roughness:0.3,emissive:0x88bbff,emissiveIntensity:0.4,side:THREE.DoubleSide});
  const wingGeo=new THREE.CircleGeometry(0.28,10);
  for(const s of [-1,1]){const wing=new THREE.Mesh(wingGeo,wingMat);wing.position.set(s*0.26,0.55,0);wing.rotation.y=s*Math.PI/2.5;wing.rotation.x=-0.3;g.add(wing);}
  const aura=new THREE.Mesh(new THREE.SphereGeometry(0.55,12,10),new THREE.MeshBasicMaterial({color:0xffe6a0,transparent:true,opacity:0.12,depthWrite:false}));

function createRemotePlayer(uid, data) {
  // 簡略化したリモートプレイヤーモデル
  const g = new THREE.Group();
  const bodyG = new THREE.Group(); g.add(bodyG);
  
  const skinMat = new THREE.MeshStandardMaterial({color: data.skinColor || 0xb97a4b, roughness: .8});
  const shirtMat = new THREE.MeshStandardMaterial({color: data.shirtColor || 0x1b2a5c, roughness: .7});
  const hairMat = new THREE.MeshStandardMaterial({color: data.hairColor || 0x2a1d16, roughness: .8});
  
  // 胴体
  const torso = new THREE.Mesh(new THREE.BoxGeometry(.52,.66,.3), shirtMat);
  torso.position.y = 1.18; torso.castShadow = true; bodyG.add(torso);
  
  // 頭
  const head = new THREE.Mesh(new THREE.SphereGeometry(.2,24,16), skinMat);
  head.position.y = 1.74; head.castShadow = true; bodyG.add(head);
  
  // 髪（簡易：帽子型）
  if (data.hair !== 'bald') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(.21,20,14,0,Math.PI*2,0,Math.PI*.55), hairMat);
    cap.position.y = 1.76; cap.rotation.x = -.15; bodyG.add(cap);
  }
  
  // 目
  const eyeMat = new THREE.MeshBasicMaterial({color: data.eyeColor || 0x111111});
  for (const s of [-1,1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.026,6,6), eyeMat);
    eye.position.set(s*.07,1.76,.18); bodyG.add(eye);
  }
  
  // 腕（簡易）
  const arms = [];
  for (const side of [-1,1]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(.14,.6,.14), skinMat);
    arm.position.set(side*.36, 1.1, 0); arm.castShadow = true; bodyG.add(arm);
    arms.push(arm);
  }
  
  // 脚（簡易）
  const legs = [];
  for (const side of [-1,1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.2,.8,.2), skinMat);
    leg.position.set(side*.14, .4, 0); leg.castShadow = true; bodyG.add(leg);
    legs.push(leg);
  }
  
  // 名前ラベル（吹き出しは別途）
  g.userData = { uid, bodyG, arms, legs, head };
  playerRoot.add(g);
  return g;
}

function removeRemotePlayer(uid) {

  }
}

// ========== Firebase: 他のプレイヤーを監視 ==========
db.ref('players').on('value', (snapshot) => {
  const data = snapshot.val() || {};
  const now = Date.now();
  
  // オンライン数更新（自分含む）
  let count = 0;
  for (const uid in data) {
    if (data[uid] && (now - (data[uid].lastSeen || 0)) < 30000) count++;
  }
  document.getElementById('onlineCount').textContent = Math.max(1, count);
  
  // 自分以外を反映
  for (const uid in data) {
    if (uid === PLAYER_ID) continue;
    const p = data[uid];
    if (!p) continue;
    
    // 30秒以上更新がなければ無視（ゴースト対策）
    if (now - (p.lastSeen || 0) > 30000) {
      removeRemotePlayer(uid);
      continue;
    }
    
    let rp = remotePlayers[uid];
    if (!rp) {
      rp = createRemotePlayer(uid, p);
      remotePlayers[uid] = rp;
    }
    
    // 位置・向き更新
    rp.position.set(p.x || 0, p.y || 0, p.z || 0);
    rp.rotation.y = p.facing || 0;
    
    // ポーズに応じた簡易アニメーション
    const bodyG = rp.userData.bodyG;
    const arms = rp.userData.arms;
    const legs = rp.userData.legs;
    if (p.pose === 'sit') {
      bodyG.position.y = -0.55;
      legs[0].rotation.x = -1.3; legs[1].rotation.x = -1.3;
      arms[0].rotation.x = -0.5; arms[1].rotation.x = -0.5;
    } else if (p.pose && p.pose.startsWith('emote_')) {
      const en = p.pose.slice(6);
      if (en === 'wave') { arms[1].rotation.x = -2.5; arms[1].rotation.z = 0.3; }
      else if (en === 'cheer') { arms[0].rotation.x = -2.5; arms[1].rotation.x = -2.5; }
    } else if (p.pose === 'jump') {
      legs[0].rotation.x = -0.5; legs[1].rotation.x = 0.4;
    } else {
      bodyG.position.y = 0;
      legs[0].rotation.x = 0; legs[1].rotation.x = 0;
      arms[0].rotation.x = 0; arms[0].rotation.z = 0;
      arms[1].rotation.x = 0; arms[1].rotation.z = 0;
    }
  }
  
  // 自分の状態も定期送信のトリガー
});

// ========== リモートプレイヤーの吹き出し ==========
const remoteBubbles = []; // { el, rp, life, age }

function showRemoteBubble(rp, name, text, duration) {
  const el = document.createElement('div');
  el.className = 'bubble';
  el.innerHTML = `<div class="name">${escapeHtml(name)}</div>${escapeHtml(text)}`;
  document.body.appendChild(el);
  remoteBubbles.push({ el, rp, life: duration/1000, age: 0 });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function updateRemoteBubbles(dt) {
  const v = new THREE.Vector3();
  for (let i = remoteBubbles.length - 1; i >= 0; i--) {
    const b = remoteBubbles[i];
    b.age += dt;
    if (!b.rp.parent) { b.el.remove(); remoteBubbles.splice(i, 1); continue; }
    
    v.set(b.rp.position.x, b.rp.position.y + 2.3, b.rp.position.z);
    v.project(camera);
    if (v.z > 1) { b.el.style.opacity = '0'; }
    else {
      b.el.style.left = ((v.x*0.5+0.5)*innerWidth) + 'px';
      b.el.style.top = ((-v.y*0.5+0.5)*innerHeight) + 'px';
      b.el.style.opacity = Math.min(1, (b.life - b.age) * 2).toFixed(2);
    }
    if (b.age >= b.life) { b.el.remove(); remoteBubbles.splice(i, 1); }
  }
}

// 妖精収集
let acornCount=0;
fairies.forEach(f=>{if(collectedAcorns[f.id]){f.collected=true;f.group.visible=false;acornCount++;}});
function updateAcornUI(){document.getElementById('acorns').textContent=acornCount;}
updateAcornUI();

let toastTimer=0;
function showToast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.style.opacity='1';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.opacity='0'},1500);
}

// 座り・エモート
let sitting=false, emoteName=null, emoteTime=0;
const sitBtn=document.getElementById('sitBtn');
const emoteBtn=document.getElementById('emoteBtn');
const emotePanel=document.getElementById('emotePanel');
const chatBtn=document.getElementById('chatBtn');

function toggleSit(){
  if(emoteName)return;
  sitting=!sitting;
  sitBtn.textContent=sitting?'立つ':'あぐら';
  showToast(sitting?'あぐらをかきました':'立ちました');
}
function toggleEmotePanel(){
  if(emotePanel.classList.contains('open')){emotePanel.classList.remove('open');}
  else{if(sitting){sitting=false;sitBtn.textContent='あぐら';}emotePanel.classList.add('open');}
}
function startEmote(name){
  emotePanel.classList.remove('open');
  if(sitting){sitting=false;sitBtn.textContent='あぐら';}
  emoteName=name;emoteTime=0;
  const labels={wave:'👋 手を振る',cheer:'🙌 喜ぶ',dance:'💃 踊る',think:'🤔 考える',stretch:'🙆 伸びをする'};
  showToast(labels[name]||name);
}
emotePanel.querySelectorAll('button[data-emote]').forEach(btn=>{
  btn.addEventListener('click',()=>startEmote(btn.dataset.emote));
});
sitBtn.addEventListener('click',toggleSit);
emoteBtn.addEventListener('click',toggleEmotePanel);
chatBtn.addEventListener('click',()=>{if(chatBar.classList.contains('open'))closeChat();else openChat();});
document.addEventListener('pointerdown',e=>{
  if(emotePanel.classList.contains('open')&&!emotePanel.contains(e.target)&&e.target!==emoteBtn){emotePanel.classList.remove('open');}
},true);

// カスタマイズパネル
const customPanel=document.getElementById('customPanel');
document.getElementById('customBtn').addEventListener('click',()=>customPanel.classList.toggle('open'));
document.querySelectorAll('[data-close]').forEach(btn=>{btn.addEventListener('click',()=>{document.getElementById(btn.dataset.close).classList.remove('open');});});
document.getElementById('hairOpts').addEventListener('click',e=>{
  const b=e.target.closest('button[data-hair]');if(!b)return;
  custom.hair=b.dataset.hair;refreshCustomUI();applyCustomization();saveLocal();
  db.ref('players/'+PLAYER_ID).update({hair:custom.hair});
});
document.getElementById('eyeShapeOpts').addEventListener('click',e=>{
  const b=e.target.closest('button[data-eye]');if(!b)return;
  custom.eyeShape=b.dataset.eye;refreshCustomUI();applyCustomization();saveLocal();
});
document.getElementById('mouthOpts').addEventListener('click',e=>{
  const b=e.target.closest('button[data-mouth]');if(!b)return;
  custom.mouth=b.dataset.mouth;refreshCustomUI();applyCustomization();saveLocal();
});
['hairColor','skinColor','shirtColor','sockColor','eyeColor'].forEach(id=>{
  document.getElementById(id).addEventListener('input',e=>{
    custom[id]=e.target.value;applyCustomization();saveLocal();
    const field=id.replace('Color','')+'Color';
    if(['skinColor','shirtColor','hairColor','eyeColor'].includes(field)){
      db.ref('players/'+PLAYER_ID).update({[field]:custom[id]});
    }
  });
});

// ========== メインループ ==========
const vel=new THREE.Vector3();let vy=0,onGround=true,phase=0,t=0;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const posEl=document.getElementById('pos');
let last=performance.now();
let saveTimer=0;

function resetPose(){
  armL.shoulder.rotation.set(0,0,0);armR.shoulder.rotation.set(0,0,0);
  armL.elbow.rotation.set(0,0,0);armR.elbow.rotation.set(0,0,0);
  legL.hip.rotation.set(0,0,0);legR.hip.rotation.set(0,0,0);
  legL.knee.rotation.set(0,0,0);legR.knee.rotation.set(0,0,0);
  body.rotation.set(0,0,0);body.position.y=0;
  legL.hip.position.set(-0.14,0.86,0);legR.hip.position.set(0.14,0.86,0);
  torsoMesh.rotation.set(0,0,0);headGroup.rotation.set(0,0,0);
}

function loop(now){
const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
const chatting=document.activeElement===chatInput;
let ix=0,iz=0;
if(!chatting){
  ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  iz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+joy.y;
}
const mag=Math.min(1,Math.hypot(ix,iz));
if(mag>0.05&&sitting){sitting=false;sitBtn.textContent='あぐら';}
if(mag>0.05&&emoteName&&emoteName!=='dance'){emoteName=null;}
const run=keys.ShiftLeft||keys.ShiftRight||mag>.9&&joy.y!==0&&Math.hypot(joy.x,joy.y)>.95;
const speed=(run?8:4)*mag;
const canMove=!sitting&&!emoteName&&!chatting;
if(canMove&&mag>0){
 const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
 let dx=fx*iz+rx*ix,dz=fz*iz+rz*ix;const l=Math.hypot(dx,dz);dx/=l;dz/=l;
 vel.x+=(dx*speed-vel.x)*Math.min(1,dt*10);vel.z+=(dz*speed-vel.z)*Math.min(1,dt*10);
 const target=Math.atan2(dx,dz);let d=target-facing;d=Math.atan2(Math.sin(d),Math.cos(d));facing+=d*Math.min(1,dt*12);
}else{vel.x*=Math.max(0,1-dt*10);vel.z*=Math.max(0,1-dt*10)}
if((keys.Space||jumpBtn)&&onGround&&!sitting&&!emoteName&&!chatting){vy=7;onGround=false}
vy-=20*dt;human.position.y+=vy*dt;
if(human.position.y<=0){human.position.y=0;vy=0;onGround=true}
human.position.x+=vel.x*dt;human.position.z+=vel.z*dt;
human.rotation.y=facing;

const sp=Math.hypot(vel.x,vel.z);
phase+=dt*(sp*1.6);
const amp=Math.min(1,sp/4)*(sp>6?.95:.65);
let swing=Math.sin(phase)*amp;

resetPose();
if(sitting){
  body.position.y=-0.55;
  legL.hip.rotation.y=1.1;legR.hip.rotation.y=-1.1;
  legL.hip.rotation.x=-1.35;legR.hip.rotation.x=-1.35;
  legL.hip.rotation.z=0.15;legR.hip.rotation.z=-0.15;
  legL.knee.rotation.x=2.0;legL.knee.rotation.y=-0.6;
  legR.knee.rotation.x=2.0;legR.knee.rotation.y=0.6;
  armL.shoulder.rotation.x=-0.6;armR.shoulder.rotation.x=-0.6;
  armL.shoulder.rotation.z=-0.25;armR.shoulder.rotation.z=0.25;
  armL.elbow.rotation.x=-0.7;armR.elbow.rotation.x=-0.7;
  body.rotation.x=0.08;
}else if(emoteName){
  emoteTime+=dt;const et=emoteTime;
  if(emoteName==='wave'){
    armR.shoulder.rotation.x=-2.6;armR.shoulder.rotation.z=0.3+Math.sin(et*10)*0.5;armR.elbow.rotation.x=-0.2;
    armL.shoulder.rotation.x=swing*-0.3;armL.shoulder.rotation.z=-0.05;armL.elbow.rotation.x=-0.3;
    legL.hip.rotation.x=swing*0.5;legR.hip.rotation.x=-swing*0.5;
    legL.knee.rotation.x=Math.max(0,-swing*0.5);legR.knee.rotation.x=Math.max(0,swing*0.5);
    if(et>2.2)emoteName=null;
  }else if(emoteName==='cheer'){
    body.position.y=Math.abs(Math.sin(et*6))*0.15;
    armL.shoulder.rotation.x=-2.8;armR.shoulder.rotation.x=-2.8;
    armL.shoulder.rotation.z=-0.25;armR.shoulder.rotation.z=0.25;
    armL.elbow.rotation.x=-0.2;armR.elbow.rotation.x=-0.2;
    legL.hip.rotation.x=-0.2;legR.hip.rotation.x=-0.2;
    legL.knee.rotation.x=0.3;legR.knee.rotation.x=0.3;
    if(et>1.8)emoteName=null;
  }else if(emoteName==='dance'){
    body.position.y=Math.abs(Math.sin(et*5))*0.08;body.rotation.x=Math.sin(et*5)*0.15;body.rotation.y=Math.sin(et*5)*0.3;
    armL.shoulder.rotation.x=-1.8+Math.sin(et*6)*0.5;armR.shoulder.rotation.x=-1.8-Math.sin(et*6)*0.5;
    armL.shoulder.rotation.z=-0.6;armR.shoulder.rotation.z=0.6;
    armL.elbow.rotation.x=-0.8;armR.elbow.rotation.x=-0.8;
    legL.hip.rotation.x=Math.sin(et*5)*0.4;legR.hip.rotation.x=-Math.sin(et*5)*0.4;
    legL.knee.rotation.x=Math.max(0,-Math.sin(et*5)*0.4);legR.knee.rotation.x=Math.max(0,Math.sin(et*5)*0.4);
    if(et>3.5){emoteName=null;body.rotation.y=0;}
  }else if(emoteName==='think'){
    armR.shoulder.rotation.x=-1.9;armR.shoulder.rotation.z=0.5;armR.elbow.rotation.x=-1.9;
    armL.shoulder.rotation.x=-0.2;armL.shoulder.rotation.z=-0.1;armL.elbow.rotation.x=-0.5;
    headGroup.rotation.z=0.25;headGroup.rotation.x=0.1;body.rotation.z=0.05;
    if(et>2.5){emoteName=null;headGroup.rotation.set(0,0,0);}
  }else if(emoteName==='stretch'){
    const p=Math.min(1,et*2);
    body.position.y=Math.sin(p*Math.PI)*0.1;
    armL.shoulder.rotation.x=-3.0;armR.shoulder.rotation.x=-3.0;
    armL.shoulder.rotation.z=-0.15;armR.shoulder.rotation.z=0.15;
    armL.elbow.rotation.x=-0.1;armR.elbow.rotation.x=-0.1;
    body.rotation.x=-Math.sin(p*Math.PI)*0.12;
    if(et>2.5)emoteName=null;
  }
  if(!emoteName)resetPose();
}else{
  if(!onGround){
    armL.shoulder.rotation.x=-2.4;armR.shoulder.rotation.x=-2.4;
    armL.elbow.rotation.x=-0.4;armR.elbow.rotation.x=-0.4;
    legL.hip.rotation.x=-0.5;legR.hip.rotation.x=0.4;
    legL.knee.rotation.x=0.6;legR.knee.rotation.x=0.2;
  }else{
    legL.hip.rotation.x=swing;legR.hip.rotation.x=-swing;
    legL.knee.rotation.x=Math.max(0,-swing*0.8);legR.knee.rotation.x=Math.max(0,swing*0.8);
    armL.shoulder.rotation.x=-swing*0.9;armR.shoulder.rotation.x=swing*0.9;
    armL.elbow.rotation.x=-0.3-Math.abs(swing)*0.3;armR.elbow.rotation.x=-0.3-Math.abs(swing)*0.3;
    armL.shoulder.rotation.z=-0.05;armR.shoulder.rotation.z=0.05;
  }
  body.position.y=onGround?Math.abs(Math.cos(phase))*0.06*amp+Math.sin(t*2)*0.008:0;
  body.rotation.x=Math.min(.2,sp*.025);
}

// 妖精
fairies.forEach(f=>{
  if(f.collected)return;
  const bob=Math.sin(t*2+f.phase)*0.12;
  f.group.position.y=0.6+bob;
  f.group.rotation.y+=dt*0.8;
  if(f.aura){const s=1+Math.sin(t*3+f.phase)*0.15;f.aura.scale.set(s,s,s);f.aura.material.opacity=0.1+Math.sin(t*3+f.phase)*0.05;}
  const dx=human.position.x-f.group.position.x;
  const dz=human.position.z-f.group.position.z;
  if(Math.hypot(dx,dz)<1.3&&Math.abs(human.position.y-0.5)<1.5){
    f.collected=true;f.group.visible=false;
    collectedAcorns[f.id]=true;acornCount++;updateAcornUI();saveLocal();
    showToast('🌰 どんぐりをゲット！');
  }
});

// カメラ
const tx=human.position.x,ty=human.position.y+1.2,tz=human.position.z;
camera.position.set(tx+Math.sin(yaw)*Math.cos(pitch)*dist,ty+Math.sin(pitch)*dist,tz+Math.cos(yaw)*Math.cos(pitch)*dist);
if(camera.position.y<.3)camera.position.y=.3;
camera.lookAt(tx,ty,tz);
sun.position.set(tx+30,40,tz+20);sun.target.position.set(tx,0,tz);
posEl.innerHTML=`<br><small>X ${tx.toFixed(1)}　Z ${tz.toFixed(1)}</small>`;

// 吹き出し更新
updateLocalBubble(dt);
updateRemoteBubbles(dt);

// Firebase状態送信
syncMyState(dt);

// ローカル保存（1秒ごと）
saveTimer+=dt;
if(saveTimer>1){saveTimer=0;saveLocal();}

renderer.render(scene,camera);
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ページ離脱時にクリーンアップ
addEventListener('beforeunload',()=>{
  saveLocal();
  db.ref('players/'+PLAYER_ID).remove();
});
addEventListener('pagehide',()=>{saveLocal();db.ref('players/'+PLAYER_ID).remove();});
</script>
</body>
