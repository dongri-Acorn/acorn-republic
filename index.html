<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どんぐりの森 オンライン</title>
<style>
:root{--ui-bg:rgba(20,24,38,.65);--ui-fg:#eef1ff;--ui-sub:#aab3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#0d1020;color:var(--ui-fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--ui-bg);backdrop-filter:blur(6px);padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;pointer-events:none;transition:opacity .25s, transform .25s;z-index:10}
#hud.hidden{opacity:0;transform:translateY(-10px);pointer-events:none}
#hud b{color:#fff}#hud small{color:var(--ui-sub)}
#acorns{color:#ffcf5c;font-weight:bold}
#onlineCount{color:#7dffa8;font-weight:bold}
#topRight{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px;z-index:20}
#topRight button{background:var(--ui-bg);color:var(--ui-fg);border:0;border-radius:10px;padding:8px 12px;font-size:12px;backdrop-filter:blur(6px);cursor:pointer}
#stick{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:120px;height:120px;border-radius:50%;background:var(--ui-bg);touch-action:none;display:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#8fa2ff}
#jump{position:fixed;right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:84px;height:84px;border-radius:50%;border:0;background:var(--ui-bg);color:var(--ui-fg);font-size:15px;touch-action:none;display:none}
#actions{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);display:flex;flex-direction:column;gap:10px;z-index:15}
#actions button{width:64px;height:64px;border-radius:50%;border:0;background:var(--ui-bg);color:var(--ui-fg);font-size:12px;touch-action:none;backdrop-filter:blur(6px);cursor:pointer}
#actions button:active{background:rgba(80,100,160,.8)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);background:rgba(20,24,38,.92);backdrop-filter:blur(10px);padding:18px;border-radius:18px;max-width:92vw;max-height:85vh;overflow:auto;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:40;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.panel h3{margin:0 0 12px;font-size:15px;color:#fff}
.panel .close{position:absolute;right:12px;top:12px;background:transparent;border:0;color:var(--ui-sub);font-size:20px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px;flex-wrap:wrap}
.row label{min-width:72px;color:var(--ui-sub)}
.row input[type="color"]{width:40px;height:32px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.row input[type="text"]{flex:1;min-width:120px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 8px;font-size:13px}
.optGroup{display:flex;gap:8px;flex-wrap:wrap}
.optGroup button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--ui-fg);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
.optGroup button.active{background:#8fa2ff;color:#0d1020;border-color:#8fa2ff;font-weight:bold}
#chatInputBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);width:min(560px,92vw);display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:45}
#chatInputBar.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#chatInputBar input{flex:1;border:0;border-radius:12px;padding:12px 14px;background:rgba(20,24,38,.92);color:#fff;font-size:15px;backdrop-filter:blur(8px);outline:none}
#chatInputBar button{border:0;border-radius:12px;padding:12px 18px;background:#8fa2ff;color:#0d1020;font-weight:bold;font-size:14px;cursor:pointer}
.bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#222;padding:8px 12px;border-radius:14px;font-size:14px;max-width:240px;word-break:break-word;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;z-index:35;transition:opacity .3s;white-space:pre-wrap;line-height:1.4}
.bubble:after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff}
.bubble.fade{opacity:0}
.bubble .name{font-size:11px;color:#666;margin-bottom:2px;font-weight:bold}
#emotePanel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%) translateY(20px);background:rgba(20,24,38,.85);backdrop-filter:blur(8px);padding:14px 16px;border-radius:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:25}
#emotePanel.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#emotePanel .title{width:100%;text-align:center;font-size:12px;color:var(--ui-sub);margin-bottom:2px}
#emotePanel button{border:0;border-radius:12px;padding:10px 14px;background:rgba(60,70,110,.9);color:var(--ui-fg);font-size:13px;cursor:pointer;white-space:nowrap}
#emotePanel button:active{background:rgba(90,110,180,.95)}
#emotePanel button .emoji{font-size:18px;margin-right:6px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,40,20,.8);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
#loginOverlay{position:fixed;inset:0;background:rgba(10,14,26,.9);display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .3s;flex-direction:column;gap:16px}
#loginOverlay.hidden{opacity:0;pointer-events:none}
#loginOverlay .card{background:rgba(20,24,38,.95);padding:28px;border-radius:20px;text-align:center;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#loginOverlay h2{margin:0 0 8px;font-size:18px}
#loginOverlay p{margin:0 0 16px;font-size:13px;color:var(--ui-sub);line-height:1.6}
#loginOverlay input{width:220px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:15px;text-align:center;outline:none}
#loginOverlay button{margin-top:14px;padding:12px 32px;border:0;border-radius:12px;background:#8fa2ff;color:#0d1020;font-weight:bold;font-size:15px;cursor:pointer}
#loginOverlay button:disabled{opacity:.5;cursor:not-allowed}
#loginOverlay .status{font-size:12px;color:var(--ui-sub);margin-top:10px;min-height:18px}
@media (pointer:coarse){#stick,#jump{display:block}#hud .pc{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loginOverlay">
  <div class="card">
    <h2>🌰 どんぐりの森 オンライン</h2>
    <p>名前を入力してはじめよう<br><small>（匿名でログインします）</small></p>
    <input id="nameInput" type="text" maxlength="16" placeholder="なまえ" value="">
    <br>
    <button id="startBtn" disabled>はじめる</button>
    <div class="status" id="loginStatus">接続中…</div>
  </div>
</div>

<div id="hud"><b>どんぐりの森 オンライン</b><br>
<span class="pc"><small>WASD/矢印：移動　Shift：走る　Space：ジャンプ<br>ドラッグ：視点　C：あぐら　E：エモート　T：チャット</small></span>
<span id="pos"></span><br>
🌰 <span id="acorns">0</span>/<span id="acornTotal">0</span>　
🟢 オンライン：<span id="onlineCount">1</span>人
</div>
<div id="topRight">
  <button id="uiToggle">UI 非表示</button>
  <button id="customBtn">カスタマイズ</button>
</div>
<div id="actions">
  <button id="sitBtn">あぐら</button>
  <button id="emoteBtn">エモート</button>
  <button id="chatBtn">チャット</button>
</div>

<div class="panel" id="customPanel">
  <button class="close" data-close="customPanel">×</button>
  <h3>キャラクターカスタマイズ</h3>
  <div class="row"><label>名前</label><input type="text" id="nameCustom" maxlength="16" placeholder="なまえ"></div>
  <div class="row"><label>髪型</label>
    <div class="optGroup" id="hairOpts">
      <button data-hair="short">ショート</button><button data-hair="long">ロング</button><button data-hair="twin">ツインテール</button><button data-hair="bob">ボブ</button><button data-hair="bald">ハゲ</button>
    </div>
  </div>
  <div class="row"><label>髪の色</label><input type="color" id="hairColor" value="#2a1d16"></div>
  <div class="row"><label>肌の色</label><input type="color" id="skinColor" value="#b97a4b"></div>
  <div class="row"><label>服の色</label><input type="color" id="shirtColor" value="#1b2a5c"></div>
  <div class="row"><label>靴下の色</label><input type="color" id="sockColor" value="#f5f5f5"></div>
  <div class="row"><label>目の色</label><input type="color" id="eyeColor" value="#111111"></div>
  <div class="row"><label>目の形</label>
    <div class="optGroup" id="eyeShapeOpts">
      <button data-eye="round">丸</button><button data-eye="happy">笑顔</button><button data-eye="sharp">キリッ</button><button data-eye="closed">閉じ</button>
    </div>
  </div>
  <div class="row"><label>口</label>
    <div class="optGroup" id="mouthOpts">
      <button data-mouth="smile">スマイル</button><button data-mouth="open">開口</button><button data-mouth="neutral">普通</button><button data-mouth="cat">ω</button>
    </div>
  </div>
</div>

<div id="emotePanel">
  <div class="title">エモートを選択</div>
  <button data-emote="wave"><span class="emoji">👋</span>手を振る</button>
  <button data-emote="cheer"><span class="emoji">🙌</span>喜ぶ</button>
  <button data-emote="dance"><span class="emoji">💃</span>踊る</button>
  <button data-emote="think"><span class="emoji">🤔</span>考える</button>
  <button data-emote="stretch"><span class="emoji">🙆</span>伸びをする</button>
</div>

<div id="chatInputBar">
  <input id="chatInput" type="text" maxlength="120" placeholder="メッセージを入力…">
  <button id="chatSend">送信</button>
</div>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<button id="jump">ジャンプ</button>

<!-- ★ Three.js は必ずモジュールスクリプトより先に読み込む ★ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, set, update, remove, onValue, onDisconnect, push, query, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

// ============================================================
// Firebase 初期化
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCDuMl1RfRWACrLEPiEKRqN4DcyTqgXsJA",
  authDomain: "acornrepublic.firebaseapp.com",
  databaseURL: "https://acornrepublic-default-rtdb.firebaseio.com",
  projectId: "acornrepublic",
  storageBucket: "acornrepublic.firebasestorage.app",
  messagingSenderId: "537724325118",
  appId: "1:537724325118:web:06936c52f80b66995069af",
  measurementId: "G-Y0E1E9K2DR"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// ============================================================
// グローバル状態
// ============================================================
let PLAYER_ID = null;
let playerName = 'ゲスト';
let gameStarted = false;

const custom = {
  hair: 'short',
  hairColor: '#2a1d16',
  skinColor: '#b97a4b',
  shirtColor: '#1b2a5c',
  sockColor: '#f5f5f5',
  eyeColor: '#111111',
  eyeShape: 'round',
  mouth: 'smile'
};

// Three.js 関連（後で初期化）
let renderer, scene, camera, sun, human, body, torso, torsoMesh, headGroup, headMesh,
    faceGroup, eyeL, eyeR, browMat, browL, browR, mouthMesh, hairGroup,
    matSkin, matShirt, matSock, matHair, matEye, matMouth,
    armL, armR, legL, legR;

// プレイヤー状態
let yaw = 0, pitch = 0.35, dist = 7;
let facing = 0;
let sitting = false, emoteName = null, emoteTime = 0;
let onGround = true, vy = 0, phase = 0;
const vel = { x: 0, z: 0 };
let hudHidden = false;

// リモートプレイヤー
const remotePlayers = {};

// 妖精
const fairies = [];
let acornCount = 0;

// チャット
let chatLog = [];
const remoteBubbles = [];
let localBubble = null;

// 入力
const keys = {};
const joy = { x: 0, y: 0 };
let jumpBtn = false;

// タイマー
let lastSync = 0;
const SYNC_INTERVAL = 0.1;
let lastTime = 0;
let saveLocalTimer = 0;

// DOM
const canvas = document.getElementById('c');
const hudEl = document.getElementById('hud');
const posEl = document.getElementById('pos');
const acornsEl = document.getElementById('acorns');
const acornTotalEl = document.getElementById('acornTotal');
const onlineCountEl = document.getElementById('onlineCount');
const toastEl = document.getElementById('toast');
const chatBar = document.getElementById('chatInputBar');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSend');
const emotePanel = document.getElementById('emotePanel');
const customPanel = document.getElementById('customPanel');
const loginOverlay = document.getElementById('loginOverlay');
const loginStatus = document.getElementById('loginStatus');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');

const SAVE_KEY = 'acorn_online_save_v1';

// ============================================================
// 匿名ログイン
// ============================================================
function initAuth() {
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    if (saved.playerName) { playerName = saved.playerName; nameInput.value = playerName; }
    if (saved.custom) Object.assign(custom, saved.custom);
    if (saved.yaw !== undefined) yaw = saved.yaw;
    if (saved.pitch !== undefined) pitch = saved.pitch;
    if (saved.dist !== undefined) dist = saved.dist;
    if (saved.facing !== undefined) facing = saved.facing;
    if (saved.hudHidden !== undefined) hudHidden = saved.hudHidden;
  } catch(e) {}

  loginStatus.textContent = '認証中…';
  signInAnonymously(auth)
    .then(() => {
      loginStatus.textContent = '接続完了。名前を入力してはじめてください';
      startBtn.disabled = false;
    })
    .catch((err) => {
      console.error(err);
      loginStatus.textContent = '認証失敗: ' + err.code + '（匿名ログインを有効にしてください）';
      startBtn.disabled = true;
    });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      PLAYER_ID = user.uid;
      console.log('auth.uid =', PLAYER_ID);
    }
  });
}

// ============================================================
// ゲーム開始
// ============================================================
async function startGame() {
  if (gameStarted || !PLAYER_ID) return;
  const name = (nameInput.value || '').trim().slice(0, 16);
  if (!name) { alert('名前を入力してください'); return; }
  playerName = name;
  gameStarted = true;
  loginOverlay.classList.add('hidden');

  initThree();
  initWorld();
  initLocalPlayer();
  applyCustomization();
  refreshCustomUI();
  updateAcornUI();
  applyHudVisibility();

  const myRef = ref(db, 'players/' + PLAYER_ID);
  await set(myRef, {
    name: playerName,
    x: 0, y: 0, z: 0, facing: 0, pose: 'stand',
    skinColor: custom.skinColor, shirtColor: custom.shirtColor,
    hairColor: custom.hairColor, hair: custom.hair, eyeColor: custom.eyeColor,
    lastSeen: Date.now()
  });
  onDisconnect(myRef).remove();

  setupRemotePlayersListener();
  setupChatListener();
  setupInput();
  setupUI();

  requestAnimationFrame(loop);
}

// ============================================================
// Three.js 初期化
// ============================================================
function initThree() {
  if (typeof THREE === 'undefined') {
    alert('Three.js の読み込みに失敗しました。ページを再読み込みしてください。');
    return;
  }
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3ff);
  scene.fog = new THREE.Fog(0xbfe3ff, 60, 220);

  camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);

  scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6b8f4e, 1.05));
  sun = new THREE.DirectionalLight(0xfff6df, 1.25);
  sun.position.set(30, 40, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 120 });
  sun.shadow.bias = -0.0005;
  scene.add(sun, sun.target);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));

  resize();
  addEventListener('resize', resize);
}

function resize() {
  if (!renderer) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// ============================================================
// ワールド
// ============================================================
function initWorld() {
  const groundGeo = new THREE.PlaneGeometry(600, 600, 60, 60);
  groundGeo.rotateX(-Math.PI / 2);
  const gpos = groundGeo.attributes.position;
  for (let i = 0; i < gpos.count; i++) {
    const x = gpos.getX(i), z = gpos.getZ(i);
    const d = Math.hypot(x, z);
    const h = (Math.sin(x * 0.05) * Math.cos(z * 0.05) * 1.6 + Math.sin(x * 0.15 + z * 0.1) * 0.4) * Math.min(1, Math.max(0, (d - 15) / 40));
    gpos.setY(i, h);
  }
  groundGeo.computeVertexNormals();
  const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x6fae4a, roughness: 1 }));
  ground.receiveShadow = true;
  scene.add(ground);

  (function addGrassField() {
    const g = new THREE.BufferGeometry();
    const N = 4000, arr = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, r = 18 + Math.random() * 140;
      arr[i * 3] = Math.cos(a) * r;
      arr[i * 3 + 1] = 0.05;
      arr[i * 3 + 2] = Math.sin(a) * r;
    }
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    const m = new THREE.PointsMaterial({ color: 0x4f8f35, size: 0.5, sizeAttenuation: true, transparent: true, opacity: 0.8 });
    const p = new THREE.Points(g, m);
    p.position.y = 0.02;
    scene.add(p);
  })();

  const grid = new THREE.GridHelper(600, 300, 0x8fbf6a, 0x7aa85a);
  grid.position.y = 0.02;
  grid.material.opacity = 0.25;
  grid.material.transparent = true;
  scene.add(grid);

  buildTreesAndScenery();
  buildFairies();
}

function makeTree(x, z, scale = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const trunkH = 2.2 * scale;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16 * scale, 0.24 * scale, trunkH, 7),
    new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 1 })
  );
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  g.add(trunk);

  const mats = [
    new THREE.MeshStandardMaterial({ color: 0x3f8f3a, roughness: 0.9 }),
    new THREE.MeshStandardMaterial({ color: 0x4fa64a, roughness: 0.9 }),
    new THREE.MeshStandardMaterial({ color: 0x5fbf55, roughness: 0.9 }),
  ];
  [[0,trunkH+0.7*scale,0,1.1*scale],[0.7*scale,trunkH+0.4*scale,0.4*scale,0.8*scale],[-0.6*scale,trunkH+0.5*scale,-0.5*scale,0.85*scale],[0.2*scale,trunkH+1.2*scale,-0.3*scale,0.7*scale]].forEach((b, i) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(b[3], 10, 8), mats[i % 3]);
    m.position.set(b[0], b[1], b[2]);
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
  });
  scene.add(g);
  return g;
}

function makeOakTree(x, z, scale = 1) {
  const g = makeTree(x, z, scale);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.9 });
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc68b3c, roughness: 0.8 });
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * Math.PI * 2, r = (0.6 + Math.random() * 0.6) * scale;
    const acorn = new THREE.Group();
    acorn.position.set(Math.cos(a) * r, 2.8 * scale + Math.random() * 0.5, Math.sin(a) * r);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.12 * scale, 8, 6), bodyMat);
    b.scale.y = 1.3; b.position.y = -0.08 * scale; acorn.add(b);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.13 * scale, 8, 6, 0, Math.PI * 2, 0, Math.PI * 0.5), capMat);

  }

}

function makeBush(x, z, scale = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const mat = new THREE.MeshStandardMaterial({ color: 0x4f9f45, roughness: 1 });
  for (let i = 0; i < 4; i++) {

    m.position.set((Math.random() - 0.5) * 0.8 * scale, 0.35 * scale, (Math.random() - 0.5) * 0.8 * scale);

}

function makeFlowerPatch(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const colors = [0xff6b8a, 0xffd166, 0xffffff, 0xb388ff, 0xff9f68];
  for (let i = 0; i < 14; i++) {

function makeRock(x, z, s = 1) {

function makeHill(x, z, r, h) {

function buildHair(style) {
  while (hairGroup.children.length) hairGroup.remove(hairGroup.children[0]);
  if (style === 'bald') return;
  const capMat = matHair;
  if (style === 'short') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.205, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), capMat);
    cap.position.y = 0.02; cap.rotation.x = -0.15; hairGroup.add(cap);
    const bang = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, 0.06), capMat);
    bang.position.set(0, 0.13, 0.15); bang.rotation.x = -0.3; hairGroup.add(bang);
  } else if (style === 'long') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.6), capMat);
    cap.position.y = 0.02; cap.rotation.x = -0.12; hairGroup.add(cap);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.5, 0.12), capMat);
    back.position.set(0, -0.15, -0.13); back.castShadow = true; hairGroup.add(back);
    for (const s of [-1, 1]) {
      const side = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.32, 0.14), capMat);
      side.position.set(s * 0.19, -0.05, -0.02); hairGroup.add(side);
    }
  } else if (style === 'twin') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.205, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), capMat);
    cap.position.y = 0.02; cap.rotation.x = -0.15; hairGroup.add(cap);
    for (const s of [-1, 1]) {
      const tailBase = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), capMat);
      tailBase.position.set(s * 0.19, 0.0, -0.05); hairGroup.add(tailBase);
      const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.03, 0.4, 8), capMat);
      tail.position.set(s * 0.25, -0.2, -0.08); tail.rotation.z = s * 0.3; tail.castShadow = true; hairGroup.add(tail);
    }
  } else if (style === 'bob') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.215, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.62), capMat);
    cap.position.y = 0.02; cap.rotation.x = -0.1; hairGroup.add(cap);
    for (const s of [-1, 1]) {
      const side = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.22, 0.16), capMat);
      side.position.set(s * 0.2, -0.05, -0.02); side.castShadow = true; hairGroup.add(side);
    }
  }
}

function applyCustomization() {
  if (!matSkin) return;
  matSkin.color.set(custom.skinColor);
  matShirt.color.set(custom.shirtColor);
  matSock.color.set(custom.sockColor);
  matHair.color.set(custom.hairColor);
  matEye.color.set(custom.eyeColor);
  browMat.color.set(custom.hairColor);
  buildHair(custom.hair);

  eyeL.scale.set(1, 1, 1); eyeR.scale.set(1, 1, 1);
  eyeL.rotation.set(0, 0, 0); eyeR.rotation.set(0, 0, 0);
  eyeL.visible = true; eyeR.visible = true;
  if (custom.eyeShape === 'happy') { eyeL.scale.set(1, 0.5, 1); eyeR.scale.set(1, 0.5, 1); }
  else if (custom.eyeShape === 'sharp') { eyeL.rotation.z = 0.4; eyeR.rotation.z = -0.4; eyeL.scale.set(1, 0.8, 1); eyeR.scale.set(1, 0.8, 1); }
  else if (custom.eyeShape === 'closed') { eyeL.visible = false; eyeR.visible = false; }

  mouthMesh.scale.set(1, 1, 1);
  if (custom.mouth === 'smile') mouthMesh.scale.set(1.2, 0.6, 1);
  else if (custom.mouth === 'open') mouthMesh.scale.set(1, 2.2, 1);
  else if (custom.mouth === 'neutral') mouthMesh.scale.set(1, 0.4, 1);
  else if (custom.mouth === 'cat') mouthMesh.scale.set(1.2, 0.7, 1);
}

}

function createRemotePlayer(uid, data) {
  const g = new THREE.Group();
  const bodyG = new THREE.Group(); g.add(bodyG);

  const skinMat = new THREE.MeshStandardMaterial({ color: data.skinColor || 0xb97a4b, roughness: 0.8 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: data.shirtColor || 0x1b2a5c, roughness: 0.7 });
  const hairMat = new THREE.MeshStandardMaterial({ color: data.hairColor || 0x2a1d16, roughness: 0.8 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.66, 0.3), shirtMat);
  torso.position.y = 1.18; torso.castShadow = true; bodyG.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), skinMat);
  head.position.y = 1.74; head.castShadow = true; bodyG.add(head);

  if (data.hair && data.hair !== 'bald') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
    cap.position.y = 1.76; cap.rotation.x = -0.15; bodyG.add(cap);
  }

  const eyeMat = new THREE.MeshBasicMaterial({ color: data.eyeColor || 0x111111 });
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.026, 6, 6), eyeMat);
    eye.position.set(s * 0.07, 1.76, 0.18); bodyG.add(eye);
  }

  const arms = [];
  for (const side of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.6, 0.14), skinMat);
    arm.position.set(side * 0.36, 1.1, 0); arm.castShadow = true; bodyG.add(arm); arms.push(arm);
  }

  const legs = [];
  for (const side of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), skinMat);
    leg.position.set(side * 0.14, 0.4, 0); leg.castShadow = true; bodyG.add(leg); legs.push(leg);
  }

  g.userData = { uid, bodyG, arms, legs, head, skinMat, shirtMat, hairMat, eyeMat };
  scene.add(g);
  return g;
}

function removeRemotePlayer(uid) {
  const rp = remotePlayers[uid];
  if (rp) {
    if (rp.userData.bubbleEl) rp.userData.bubbleEl.remove();
    scene.remove(rp);
    delete remotePlayers[uid];
  }
}

function setupRemotePlayersListener() {
  onValue(ref(db, 'players'), (snapshot) => {
    const data = snapshot.val() || {};
    const now = Date.now();

    let count = 0;
    for (const uid in data) {
      if (data[uid] && (now - (data[uid].lastSeen || 0)) < 30000) count++;
    }
    onlineCountEl.textContent = Math.max(1, count);

    for (const uid in data) {
      if (uid === PLAYER_ID) continue;
      const p = data[uid];
      if (!p) { removeRemotePlayer(uid); continue; }
      if (now - (p.lastSeen || 0) > 30000) { removeRemotePlayer(uid); continue; }

      let rp = remotePlayers[uid];
      if (!rp) { rp = createRemotePlayer(uid, p); remotePlayers[uid] = rp; }

      const ud = rp.userData;
      ud.skinMat.color.set(p.skinColor || '#b97a4b');
      ud.shirtMat.color.set(p.shirtColor || '#1b2a5c');
      ud.hairMat.color.set(p.hairColor || '#2a1d16');
      ud.eyeMat.color.set(p.eyeColor || '#111111');

      rp.position.set(p.x || 0, p.y || 0, p.z || 0);
      rp.rotation.y = p.facing || 0;

      const bG = ud.bodyG, arms = ud.arms, legs = ud.legs;
      bG.position.y = 0; bG.rotation.x = 0; bG.rotation.y = 0;
      arms[0].rotation.set(0, 0, 0); arms[1].rotation.set(0, 0, 0);
      legs[0].rotation.set(0, 0, 0); legs[1].rotation.set(0, 0, 0);

      if (p.pose === 'sit') {
        bG.position.y = -0.55;
        legs[0].rotation.x = -1.3; legs[1].rotation.x = -1.3;
        arms[0].rotation.x = -0.5; arms[1].rotation.x = -0.5;
      } else if (p.pose && p.pose.startsWith('emote_')) {
        const en = p.pose.slice(6);
        if (en === 'wave') { arms[1].rotation.x = -2.5; arms[1].rotation.z = 0.3; }
        else if (en === 'cheer') { arms[0].rotation.x = -2.5; arms[1].rotation.x = -2.5; }
        else if (en === 'dance') { bG.rotation.y = Math.sin(now / 200) * 0.3; arms[0].rotation.x = -1.5; arms[1].rotation.x = -1.5; }
        else if (en === 'think') { arms[1].rotation.x = -1.9; arms[1].rotation.z = 0.5; }
        else if (en === 'stretch') { arms[0].rotation.x = -3; arms[1].rotation.x = -3; }
      } else if (p.pose === 'jump') {
        legs[0].rotation.x = -0.5; legs[1].rotation.x = 0.4;
        arms[0].rotation.x = -2; arms[1].rotation.x = -2;
      }
    }
  });
}

function setupChatListener() {
  const q = query(ref(db, 'chat'), limitToLast(50));
  onChildAdded(q, (snapshot) => {
    const msg = snapshot.val();
    if (!msg || !msg.uid) return;
    if (msg.uid === PLAYER_ID) return;
    showRemoteBubble(msg.uid, msg.name || 'ゲスト', msg.text, 5000);
    addChatLog(msg.name || 'ゲスト', msg.text);
  });
}

function addChatLog(name, text) {
  chatLog.push({ name, text });
  if (chatLog.length > 30) chatLog.shift();
}

function showLocalBubble(text, duration = 4000) {
  if (localBubble) localBubble.el.remove();
  const el = document.createElement('div');
  el.className = 'bubble';
  el.textContent = text;
  document.body.appendChild(el);
  localBubble = { el, life: duration / 1000, age: 0 };
}

function showRemoteBubble(uid, name, text, duration) {
  const el = document.createElement('div');
  el.className = 'bubble';
  el.innerHTML = `<div class="name">${escapeHtml(name)}</div>${escapeHtml(text)}`;
  document.body.appendChild(el);
  remoteBubbles.push({ el, uid, life: duration / 1000, age: 0 });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function updateBubbles(dt) {
  const v = new THREE.Vector3();

  if (localBubble) {
    localBubble.age += dt;
    v.set(human.position.x, human.position.y + 2.25, human.position.z);
    v.project(camera);
    if (v.z > 1) localBubble.el.style.opacity = '0';
    else {
      localBubble.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
      localBubble.el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
      localBubble.el.style.opacity = Math.min(1, (localBubble.life - localBubble.age) * 2).toFixed(2);
    }
    if (localBubble.age >= localBubble.life) { localBubble.el.remove(); localBubble = null; }
  }

  for (let i = remoteBubbles.length - 1; i >= 0; i--) {
    const b = remoteBubbles[i];
    b.age += dt;
    const rp = remotePlayers[b.uid];
    if (!rp) { b.el.remove(); remoteBubbles.splice(i, 1); continue; }
    v.set(rp.position.x, rp.position.y + 2.3, rp.position.z);
    v.project(camera);
    if (v.z > 1) b.el.style.opacity = '0';
    else {
      b.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
      b.el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
      b.el.style.opacity = Math.min(1, (b.life - b.age) * 2).toFixed(2);
    }
    if (b.age >= b.life) { b.el.remove(); remoteBubbles.splice(i, 1); }
  }
}

function sendChatMessage(text) {
  push(ref(db, 'chat'), {
    uid: PLAYER_ID,
    name: playerName,
    text: text,
    time: Date.now()
  }).catch(err => console.error('chat send failed:', err));
}

// ============================================================
// 入力
// ============================================================
function setupInput() {
  addEventListener('keydown', (e) => {
    if (document.activeElement === chatInput) {
      if (e.key === 'Escape') closeChat();
      return;
    }
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'KeyC' && !e.repeat) toggleSit();
    if (e.code === 'KeyE' && !e.repeat) toggleEmotePanel();
    if (e.code === 'KeyT' && !e.repeat) { e.preventDefault(); openChat(); }
  });
  addEventListener('keyup', (e) => { keys[e.code] = false; });

  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  let stickId = null;
  function stickMove(e) {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + 60), dy = e.clientY - (r.top + 60);
    const l = Math.hypot(dx, dy), m = 45;
    if (l > m) { dx *= m / l; dy *= m / l; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx / m; joy.y = -dy / m;
  }
  stick.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
  stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) stickMove(e); });
  const stickEnd = (e) => { if (e.pointerId === stickId) { stickId = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
  stick.addEventListener('pointerup', stickEnd);
  stick.addEventListener('pointercancel', stickEnd);

  const jb = document.getElementById('jump');
  jb.addEventListener('pointerdown', () => jumpBtn = true);
  jb.addEventListener('pointerup', () => jumpBtn = false);

  const ptrs = new Map();
  canvas.addEventListener('pointerdown', (e) => {
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    yaw -= (e.clientX - p[0]) * 0.006;
    pitch = Math.min(1.35, Math.max(-0.1, pitch + (e.clientY - p[1]) * 0.005));
    p[0] = e.clientX; p[1] = e.clientY;
  });
  const up = (e) => ptrs.delete(e.pointerId);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    dist = Math.min(20, Math.max(2.5, dist + e.deltaY * 0.01));
  }, { passive: false });
}

// ============================================================
// UI
// ============================================================
function setupUI() {
  document.getElementById('uiToggle').addEventListener('click', () => {
    hudHidden = !hudHidden;
    applyHudVisibility();
    saveLocal();
  });
  applyHudVisibility();

  document.getElementById('customBtn').addEventListener('click', () => customPanel.classList.toggle('open'));
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => document.getElementById(btn.dataset.close).classList.remove('open'));
  });

  document.getElementById('hairOpts').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-hair]');
    if (!b) return;
    custom.hair = b.dataset.hair;
    refreshCustomUI(); applyCustomization(); saveLocal();
    if (PLAYER_ID) update(ref(db, 'players/' + PLAYER_ID), { hair: custom.hair }).catch(() => {});
  });
  document.getElementById('eyeShapeOpts').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-eye]');
    if (!b) return;
    custom.eyeShape = b.dataset.eye;
    refreshCustomUI(); applyCustomization(); saveLocal();
  });
  document.getElementById('mouthOpts').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mouth]');
    if (!b) return;
    custom.mouth = b.dataset.mouth;
    refreshCustomUI(); applyCustomization(); saveLocal();
  });

  ['hairColor', 'skinColor', 'shirtColor', 'sockColor', 'eyeColor'].forEach(id => {
    document.getElementById(id).addEventListener('input', (e) => {
      custom[id] = e.target.value;
      applyCustomization(); saveLocal();
      if (PLAYER_ID && ['skinColor', 'shirtColor', 'hairColor', 'eyeColor'].includes(id)) {
        update(ref(db, 'players/' + PLAYER_ID), { [id]: custom[id] }).catch(() => {});
      }
    });
  });

  document.getElementById('nameCustom').addEventListener('change', (e) => {
    const v = (e.target.value || '').trim().slice(0, 16);
    if (v) {
      playerName = v;
      saveLocal();
      if (PLAYER_ID) update(ref(db, 'players/' + PLAYER_ID), { name: playerName }).catch(() => {});
    }
  });

  document.getElementById('sitBtn').addEventListener('click', toggleSit);
  document.getElementById('emoteBtn').addEventListener('click', toggleEmotePanel);
  document.getElementById('chatBtn').addEventListener('click', () => {
    if (chatBar.classList.contains('open')) closeChat();
    else openChat();
  });

  emotePanel.querySelectorAll('button[data-emote]').forEach(btn => {
    btn.addEventListener('click', () => startEmote(btn.dataset.emote));
  });

  chatSendBtn.addEventListener('click', doSendChat);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); doSendChat(); }
    if (e.key === 'Escape') closeChat();
  });

  document.addEventListener('pointerdown', (e) => {
    if (emotePanel.classList.contains('open') && !emotePanel.contains(e.target) && e.target.id !== 'emoteBtn') {
      emotePanel.classList.remove('open');
    }
  }, true);
}

function applyHudVisibility() {
  hudEl.classList.toggle('hidden', hudHidden);
  document.getElementById('uiToggle').textContent = hudHidden ? 'UI 表示' : 'UI 非表示';
}

function openChat() { chatBar.classList.add('open'); chatInput.focus(); }
function closeChat() { chatBar.classList.remove('open'); chatInput.blur(); }

function doSendChat() {
  const text = chatInput.value.trim();
  if (!text) { closeChat(); return; }
  chatInput.value = '';
  closeChat();
  showLocalBubble(text, 4000);
  addChatLog(playerName, text);
  sendChatMessage(text);
}

function toggleSit() {
  if (emoteName) return;
  sitting = !sitting;
  document.getElementById('sitBtn').textContent = sitting ? '立つ' : 'あぐら';
  showToast(sitting ? 'あぐらをかきました' : '立ちました');
}

function toggleEmotePanel() {
  if (emotePanel.classList.contains('open')) emotePanel.classList.remove('open');
  else {
    if (sitting) { sitting = false; document.getElementById('sitBtn').textContent = 'あぐら'; }
    emotePanel.classList.add('open');
  }
}

function startEmote(name) {
  emotePanel.classList.remove('open');
  if (sitting) { sitting = false; document.getElementById('sitBtn').textContent = 'あぐら'; }
  emoteName = name;
  emoteTime = 0;
  const labels = { wave: '👋 手を振る', cheer: '🙌 喜ぶ', dance: '💃 踊る', think: '🤔 考える', stretch: '🙆 伸びをする' };
  showToast(labels[name] || name);
}

let toastTimer = 0;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 1500);
}

function updateAcornUI() { acornsEl.textContent = acornCount; }

// ============================================================
// ローカル保存
// ============================================================
function saveLocal() {
  if (!human) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      x: human.position.x, y: human.position.y, z: human.position.z,
      facing, yaw, pitch, dist, custom, playerName, hudHidden
    }));
  } catch(e) {}
}

// ============================================================
// ポーズリセット
// ============================================================
function resetPose() {
  armL.shoulder.rotation.set(0, 0, 0);
  armR.shoulder.rotation.set(0, 0, 0);
  armL.elbow.rotation.set(0, 0, 0);
  armR.elbow.rotation.set(0, 0, 0);
  legL.hip.rotation.set(0, 0, 0);
  legR.hip.rotation.set(0, 0, 0);
  legL.knee.rotation.set(0, 0, 0);
  legR.knee.rotation.set(0, 0, 0);
  body.rotation.set(0, 0, 0);
  body.position.y = 0;
  legL.hip.position.set(-0.14, 0.86, 0);
  legR.hip.position.set(0.14, 0.86, 0);
  torsoMesh.rotation.set(0, 0, 0);
  headGroup.rotation.set(0, 0, 0);
}

// ============================================================
// Firebase 同期
// ============================================================
function syncMyState(dt, force = false) {
  if (!PLAYER_ID || !human) return;
  lastSync += dt;
  if (!force && lastSync < SYNC_INTERVAL) return;
  lastSync = 0;

  let pose = 'stand';
  if (sitting) pose = 'sit';
  else if (emoteName) pose = 'emote_' + emoteName;
  else if (!onGround) pose = 'jump';
  else if (Math.hypot(vel.x, vel.z) > 0.1) pose = 'walk';

  update(ref(db, 'players/' + PLAYER_ID), {
    x: human.position.x, y: human.position.y, z: human.position.z,
    facing: facing, pose: pose, lastSeen: Date.now()
  }).catch(() => {});
}

// ============================================================
// メインループ
// ============================================================
function loop(now) {
  requestAnimationFrame(loop);
  if (!renderer || !gameStarted || !human) return;

  const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
  lastTime = now;

  const chatting = document.activeElement === chatInput;
  let ix = 0, iz = 0;
  if (!chatting) {
    ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
    iz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + joy.y;
  }
  const mag = Math.min(1, Math.hypot(ix, iz));

  if (mag > 0.05 && sitting) { sitting = false; document.getElementById('sitBtn').textContent = 'あぐら'; }
  if (mag > 0.05 && emoteName && emoteName !== 'dance') emoteName = null;

  const run = keys.ShiftLeft || keys.ShiftRight || (mag > 0.9 && joy.y !== 0 && Math.hypot(joy.x, joy.y) > 0.95);
  const speed = (run ? 8 : 4) * mag;
  const canMove = !sitting && !emoteName && !chatting;

  if (canMove && mag > 0) {
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let dx = fx * iz + rx * ix, dz = fz * iz + rz * ix;
    const l = Math.hypot(dx, dz); dx /= l; dz /= l;
    vel.x += (dx * speed - vel.x) * Math.min(1, dt * 10);
    vel.z += (dz * speed - vel.z) * Math.min(1, dt * 10);
    const target = Math.atan2(dx, dz);
    let d = target - facing;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    facing += d * Math.min(1, dt * 12);
  } else {
    vel.x *= Math.max(0, 1 - dt * 10);
    vel.z *= Math.max(0, 1 - dt * 10);
  }

  if ((keys.Space || jumpBtn) && onGround && !sitting && !emoteName && !chatting) { vy = 7; onGround = false; }
  vy -= 20 * dt;
  human.position.y += vy * dt;
  if (human.position.y <= 0) { human.position.y = 0; vy = 0; onGround = true; }
  human.position.x += vel.x * dt;
  human.position.z += vel.z * dt;
  human.rotation.y = facing;

  const sp = Math.hypot(vel.x, vel.z);
  phase += dt * (sp * 1.6);
  const amp = Math.min(1, sp / 4) * (sp > 6 ? 0.95 : 0.65);
  const swing = Math.sin(phase) * amp;

  resetPose();

  if (sitting) {
    body.position.y = -0.55;
    legL.hip.rotation.y = 1.1; legR.hip.rotation.y = -1.1;
    legL.hip.rotation.x = -1.35; legR.hip.rotation.x = -1.35;
    legL.hip.rotation.z = 0.15; legR.hip.rotation.z = -0.15;
    legL.knee.rotation.x = 2.0; legL.knee.rotation.y = -0.6;
    legR.knee.rotation.x = 2.0; legR.knee.rotation.y = 0.6;
    armL.shoulder.rotation.x = -0.6; armR.shoulder.rotation.x = -0.6;
    armL.shoulder.rotation.z = -0.25; armR.shoulder.rotation.z = 0.25;
    armL.elbow.rotation.x = -0.7; armR.elbow.rotation.x = -0.7;
    body.rotation.x = 0.08;
  } else if (emoteName) {
    emoteTime += dt;
    const et = emoteTime;
    if (emoteName === 'wave') {
      armR.shoulder.rotation.x = -2.6;
      armR.shoulder.rotation.z = 0.3 + Math.sin(et * 10) * 0.5;
      armR.elbow.rotation.x = -0.2;
      armL.shoulder.rotation.x = swing * -0.3;
      armL.elbow.rotation.x = -0.3;
      if (et > 2.2) emoteName = null;
    } else if (emoteName === 'cheer') {
      body.position.y = Math.abs(Math.sin(et * 6)) * 0.15;
      armL.shoulder.rotation.x = -2.8; armR.shoulder.rotation.x = -2.8;
      armL.shoulder.rotation.z = -0.25; armR.shoulder.rotation.z = 0.25;
      if (et > 1.8) emoteName = null;
    } else if (emoteName === 'dance') {
      body.position.y = Math.abs(Math.sin(et * 5)) * 0.08;
      body.rotation.x = Math.sin(et * 5) * 0.15;
      body.rotation.y = Math.sin(et * 5) * 0.3;
      armL.shoulder.rotation.x = -1.8 + Math.sin(et * 6) * 0.5;
      armR.shoulder.rotation.x = -1.8 - Math.sin(et * 6) * 0.5;
      armL.shoulder.rotation.z = -0.6; armR.shoulder.rotation.z = 0.6;
      if (et > 3.5) { emoteName = null; body.rotation.y = 0; }
    } else if (emoteName === 'think') {
      armR.shoulder.rotation.x = -1.9; armR.shoulder.rotation.z = 0.5;
      armR.elbow.rotation.x = -1.9;
      armL.shoulder.rotation.x = -0.2; armL.elbow.rotation.x = -0.5;
      headGroup.rotation.z = 0.25; headGroup.rotation.x = 0.1;
      if (et > 2.5) { emoteName = null; headGroup.rotation.set(0, 0, 0); }
    } else if (emoteName === 'stretch') {
      const p = Math.min(1, et * 2);
      body.position.y = Math.sin(p * Math.PI) * 0.1;
      armL.shoulder.rotation.x = -3; armR.shoulder.rotation.x = -3;
      body.rotation.x = -Math.sin(p * Math.PI) * 0.12;
      if (et > 2.5) emoteName = null;
    }
  } else {
    if (!onGround) {
      armL.shoulder.rotation.x = -2.4; armR.shoulder.rotation.x = -2.4;
      legL.hip.rotation.x = -0.5; legR.hip.rotation.x = 0.4;
    } else {
      legL.hip.rotation.x = swing; legR.hip.rotation.x = -swing;
      legL.knee.rotation.x = Math.max(0, -swing * 0.8);
      legR.knee.rotation.x = Math.max(0, swing * 0.8);
      armL.shoulder.rotation.x = -swing * 0.9; armR.shoulder.rotation.x = swing * 0.9;
      armL.elbow.rotation.x = -0.3 - Math.abs(swing) * 0.3;
      armR.elbow.rotation.x = -0.3 - Math.abs(swing) * 0.3;
    }
    body.position.y = onGround ? Math.abs(Math.cos(phase)) * 0.06 * amp + Math.sin(now / 500) * 0.008 : 0;
    body.rotation.x = Math.min(0.2, sp * 0.025);
  }

  fairies.forEach(f => {
    if (f.collected) return;
    const bob = Math.sin(now / 500 + f.phase) * 0.12;
    f.group.position.y = 0.6 + bob;
    f.group.rotation.y += dt * 0.8;
    if (f.aura) {
      const s = 1 + Math.sin(now / 333 + f.phase) * 0.15;
      f.aura.scale.set(s, s, s);
      f.aura.material.opacity = 0.1 + Math.sin(now / 333 + f.phase) * 0.05;
    }
    const dx = human.position.x - f.group.position.x;
    const dz = human.position.z - f.group.position.z;
    if (Math.hypot(dx, dz) < 1.3 && Math.abs(human.position.y - 0.5) < 1.5) {
      f.collected = true;
      f.group.visible = false;
      acornCount++;
      updateAcornUI();
      showToast('🌰 どんぐりをゲット！');
    }
  });

  const tx = human.position.x, ty = human.position.y + 1.2, tz = human.position.z;
  camera.position.set(
    tx + Math.sin(yaw) * Math.cos(pitch) * dist,
    ty + Math.sin(pitch) * dist,
    tz + Math.cos(yaw) * Math.cos(pitch) * dist
  );
  if (camera.position.y < 0.3) camera.position.y = 0.3;
  camera.lookAt(tx, ty, tz);
  sun.position.set(tx + 30, 40, tz + 20);
  sun.target.position.set(tx, 0, tz);
  posEl.innerHTML = `<br><small>X ${tx.toFixed(1)}　Z ${tz.toFixed(1)}</small>`;

  updateBubbles(dt);
  syncMyState(dt);

  saveLocalTimer += dt;
  if (saveLocalTimer > 1) { saveLocalTimer = 0; saveLocal(); }

  renderer.render(scene, camera);
}

// ============================================================
// 起動
// ============================================================
startBtn.addEventListener('click', startGame);
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); startGame(); }
});
initAuth();

addEventListener('beforeunload', () => {
  saveLocal();
  if (PLAYER_ID) remove(ref(db, 'players/' + PLAYER_ID));
});
addEventListener('pagehide', () => {
  saveLocal();
  if (PLAYER_ID) remove(ref(db, 'players/' + PLAYER_ID));
});
</script>
