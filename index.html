<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どんぐりの森 オンライン</title>
<style>
:root{--ui-bg:rgba(20,24,38,.65);--ui-fg:#eef1ff;--ui-sub:#aab3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#0d1020;color:var(--ui-fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--ui-bg);backdrop-filter:blur(6px);padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.7;pointer-events:none;transition:opacity .25s, transform .25s;z-index:10}
#hud.hidden{opacity:0;transform:translateY(-10px);pointer-events:none}
#hud b{color:#fff}#hud small{color:var(--ui-sub)}
#acorns{color:#ffcf5c;font-weight:bold}
#onlineCount{color:#7dffa8;font-weight:bold}
#topRight{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px;z-index:20}
#topRight button{background:var(--ui-bg);color:var(--ui-fg);border:0;border-radius:10px;padding:8px 12px;font-size:12px;backdrop-filter:blur(6px);cursor:pointer}
#stick{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:120px;height:120px;border-radius:50%;background:var(--ui-bg);touch-action:none;display:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#8fa2ff}
#jump{position:fixed;right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:84px;height:84px;border-radius:50%;border:0;background:var(--ui-bg);color:var(--ui-fg);font-size:15px;touch-action:none;display:none}
#actions{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);display:flex;flex-direction:column;gap:10px;z-index:15}
#actions button{width:64px;height:64px;border-radius:50%;border:0;background:var(--ui-bg);color:var(--ui-fg);font-size:12px;touch-action:none;backdrop-filter:blur(6px);cursor:pointer}
#actions button:active{background:rgba(80,100,160,.8)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);background:rgba(20,24,38,.92);backdrop-filter:blur(10px);padding:18px;border-radius:18px;max-width:92vw;max-height:85vh;overflow:auto;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:40;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.panel h3{margin:0 0 12px;font-size:15px;color:#fff}
.panel .close{position:absolute;right:12px;top:12px;background:transparent;border:0;color:var(--ui-sub);font-size:20px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px;flex-wrap:wrap}
.row label{min-width:72px;color:var(--ui-sub)}
.row input[type="color"]{width:40px;height:32px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.row input[type="text"]{flex:1;min-width:120px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 8px;font-size:13px}
.optGroup{display:flex;gap:8px;flex-wrap:wrap}
.optGroup button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--ui-fg);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
.optGroup button.active{background:#8fa2ff;color:#0d1020;border-color:#8fa2ff;font-weight:bold}
#chatInputBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);width:min(560px,92vw);display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:45}
#chatInputBar.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#chatInputBar input{flex:1;border:0;border-radius:12px;padding:12px 14px;background:rgba(20,24,38,.92);color:#fff;font-size:15px;backdrop-filter:blur(8px);outline:none}
#chatInputBar button{border:0;border-radius:12px;padding:12px 18px;background:#8fa2ff;color:#0d1020;font-weight:bold;font-size:14px;cursor:pointer}
.bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#222;padding:8px 12px;border-radius:14px;font-size:14px;max-width:240px;word-break:break-word;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;z-index:35;transition:opacity .3s;white-space:pre-wrap;line-height:1.4}
.bubble:after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff}
.bubble .name{font-size:11px;color:#666;margin-bottom:2px;font-weight:bold}
#emotePanel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%) translateY(20px);background:rgba(20,24,38,.85);backdrop-filter:blur(8px);padding:14px 16px;border-radius:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:25}
#emotePanel.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#emotePanel .title{width:100%;text-align:center;font-size:12px;color:var(--ui-sub);margin-bottom:2px}
#emotePanel button{border:0;border-radius:12px;padding:10px 14px;background:rgba(60,70,110,.9);color:var(--ui-fg);font-size:13px;cursor:pointer;white-space:nowrap}
#emotePanel button .emoji{font-size:18px;margin-right:6px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,40,20,.8);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
#loginOverlay{position:fixed;inset:0;background:rgba(10,14,26,.9);display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .3s;flex-direction:column;gap:16px}
#loginOverlay.hidden{opacity:0;pointer-events:none}
#loginOverlay .card{background:rgba(20,24,38,.95);padding:28px;border-radius:20px;text-align:center;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#loginOverlay h2{margin:0 0 8px;font-size:18px}
#loginOverlay p{margin:0 0 16px;font-size:13px;color:var(--ui-sub);line-height:1.6}
#loginOverlay input{width:220px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:15px;text-align:center;outline:none}
#loginOverlay button{margin-top:14px;padding:12px 32px;border:0;border-radius:12px;background:#8fa2ff;color:#0d1020;font-weight:bold;font-size:15px;cursor:pointer}
#loginOverlay button:disabled{opacity:.5;cursor:not-allowed}
#loginOverlay .status{font-size:12px;color:var(--ui-sub);margin-top:10px;min-height:18px}
@media (pointer:coarse){#stick,#jump{display:block}#hud .pc{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loginOverlay">
  <div class="card">
    <h2>🌰 どんぐりの森 オンライン</h2>
    <p>名前を入力してはじめよう<br><small>（匿名でログインします）</small></p>
    <input id="nameInput" type="text" maxlength="16" placeholder="なまえ" value="">
    <br>
    <button id="startBtn" disabled>はじめる</button>
    <div class="status" id="loginStatus">接続中…</div>
  </div>
</div>

<div id="hud"><b>どんぐりの森 オンライン</b><br>
<span class="pc"><small>WASD/矢印：移動　Shift：走る　Space：ジャンプ<br>ドラッグ：視点　C：あぐら　E：エモート　T：チャット</small></span>
<span id="pos"></span><br>
🌰 <span id="acorns">0</span>/<span id="acornTotal">0</span>　
🟢 オンライン：<span id="onlineCount">1</span>人
</div>
<div id="topRight">
  <button id="uiToggle">UI 非表示</button>
  <button id="customBtn">カスタマイズ</button>
</div>
<div id="actions">
  <button id="sitBtn">あぐら</button>
  <button id="emoteBtn">エモート</button>
  <button id="chatBtn">チャット</button>
</div>

<div class="panel" id="customPanel">
  <button class="close" data-close="customPanel">×</button>
  <h3>キャラクターカスタマイズ</h3>
  <div class="row"><label>名前</label><input type="text" id="nameCustom" maxlength="16" placeholder="なまえ"></div>
  <div class="row"><label>髪型</label>
    <div class="optGroup" id="hairOpts">
      <button data-hair="short">ショート</button><button data-hair="long">ロング</button><button data-hair="twin">ツインテール</button><button data-hair="bob">ボブ</button><button data-hair="bald">ハゲ</button>
    </div>
  </div>
  <div class="row"><label>髪の色</label><input type="color" id="hairColor" value="#2a1d16"></div>
  <div class="row"><label>肌の色</label><input type="color" id="skinColor" value="#b97a4b"></div>
  <div class="row"><label>服の色</label><input type="color" id="shirtColor" value="#1b2a5c"></div>
  <div class="row"><label>靴下の色</label><input type="color" id="sockColor" value="#f5f5f5"></div>
  <div class="row"><label>目の色</label><input type="color" id="eyeColor" value="#111111"></div>
  <div class="row"><label>目の形</label>
    <div class="optGroup" id="eyeShapeOpts">
      <button data-eye="round">丸</button><button data-eye="happy">笑顔</button><button data-eye="sharp">キリッ</button><button data-eye="closed">閉じ</button>
    </div>
  </div>
  <div class="row"><label>口</label>
    <div class="optGroup" id="mouthOpts">
      <button data-mouth="smile">スマイル</button><button data-mouth="open">開口</button><button data-mouth="neutral">普通</button><button data-mouth="cat">ω</button>
    </div>
  </div>
</div>

<div id="emotePanel">
  <div class="title">エモートを選択</div>
  <button data-emote="wave"><span class="emoji">👋</span>手を振る</button>
  <button data-emote="cheer"><span class="emoji">🙌</span>喜ぶ</button>
  <button data-emote="dance"><span class="emoji">💃</span>踊る</button>
  <button data-emote="think"><span class="emoji">🤔</span>考える</button>
  <button data-emote="stretch"><span class="emoji">🙆</span>伸びをする</button>
</div>

<div id="chatInputBar">
  <input id="chatInput" type="text" maxlength="120" placeholder="メッセージを入力…">
  <button id="chatSend">送信</button>
</div>
<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<button id="jump">ジャンプ</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, set, update, remove, onValue, onDisconnect, push, query, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDuMl1RfRWACrLEPiEKRqN4DcyTqgXsJA",
  authDomain: "acornrepublic.firebaseapp.com",
  databaseURL: "https://acornrepublic-default-rtdb.firebaseio.com",
  projectId: "acornrepublic",
  storageBucket: "acornrepublic.firebasestorage.app",
  messagingSenderId: "537724325118",
  appId: "1:537724325118:web:06936c52f80b66995069af",
  measurementId: "G-Y0E1E9K2DR"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let PLAYER_ID = null;
let playerName = 'ゲスト';
let gameStarted = false;

const custom = {
  hair: 'short', hairColor: '#2a1d16', skinColor: '#b97a4b',
  shirtColor: '#1b2a5c', sockColor: '#f5f5f5', eyeColor: '#111111',
  eyeShape: 'round', mouth: 'smile'
};

let renderer, scene, camera, sun;
let myModel;

let yaw = 0, pitch = 0.35, dist = 7;
let facing = 0;
let sitting = false, emoteName = null, emoteTime = 0;
let onGround = true, vy = 0, phase = 0;
const vel = { x: 0, z: 0 };
let hudHidden = false;

const remotePlayers = {};
const fairies = [];
let acornCount = 0;

let chatLog = [];
const remoteBubbles = [];
let localBubble = null;

const keys = {};
const joy = { x: 0, y: 0 };
let jumpBtn = false;

let lastSync = 0;
const SYNC_INTERVAL = 0.05;
let lastTime = 0;
let saveLocalTimer = 0;

// ★ コリジョン関連
const colliders = []; // {minX,maxX,minY,maxY,minZ,maxZ}
const stairs = [];    // {x,z,w,d,baseY,stepH,steps,axis}
let houseOrigin = new THREE.Vector3(10, 0, 6);

const canvas = document.getElementById('c');
const hudEl = document.getElementById('hud');
const posEl = document.getElementById('pos');
const acornsEl = document.getElementById('acorns');
const acornTotalEl = document.getElementById('acornTotal');
const onlineCountEl = document.getElementById('onlineCount');
const toastEl = document.getElementById('toast');
const chatBar = document.getElementById('chatInputBar');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSend');
const emotePanel = document.getElementById('emotePanel');
const customPanel = document.getElementById('customPanel');
const loginOverlay = document.getElementById('loginOverlay');
const loginStatus = document.getElementById('loginStatus');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');

const SAVE_KEY = 'acorn_online_save_v4';

// ============================================================
// 認証
// ============================================================
function initAuth() {
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    if (saved.playerName) { playerName = saved.playerName; nameInput.value = playerName; }
    if (saved.custom) Object.assign(custom, saved.custom);
    if (saved.yaw !== undefined) yaw = saved.yaw;
    if (saved.pitch !== undefined) pitch = saved.pitch;
    if (saved.dist !== undefined) dist = saved.dist;
    if (saved.facing !== undefined) facing = saved.facing;
    if (saved.hudHidden !== undefined) hudHidden = saved.hudHidden;
  } catch(e) {}

  loginStatus.textContent = '認証中…';
  signInAnonymously(auth)
    .then(() => { loginStatus.textContent = '接続完了。名前を入力してはじめてください'; startBtn.disabled = false; })
    .catch((err) => {
      console.error(err);
      loginStatus.textContent = '認証失敗: ' + err.code + '（匿名ログインを有効にしてください）';
      startBtn.disabled = true;
    });

  onAuthStateChanged(auth, (user) => {
    if (user) { PLAYER_ID = user.uid; console.log('auth.uid =', PLAYER_ID); }
  });
}

// ============================================================
// モデル構築
// ============================================================
function meshBox(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true;
  return m;
}

function buildCharacterModel(colors) {
  const model = {};
  model.matSkin = new THREE.MeshStandardMaterial({ color: colors.skinColor || '#b97a4b', roughness: 0.8 });
  model.matShirt = new THREE.MeshStandardMaterial({ color: colors.shirtColor || '#1b2a5c', roughness: 0.7 });
  model.matSock = new THREE.MeshStandardMaterial({ color: colors.sockColor || '#f5f5f5', roughness: 0.7 });
  model.matHair = new THREE.MeshStandardMaterial({ color: colors.hairColor || '#2a1d16', roughness: 0.8 });
  model.matEye = new THREE.MeshBasicMaterial({ color: colors.eyeColor || '#111111' });
  model.matMouth = new THREE.MeshBasicMaterial({ color: 0x6b2a2a });

  const group = new THREE.Group();
  const body = new THREE.Group(); group.add(body);
  const torso = new THREE.Group(); body.add(torso);

  const torsoMesh = meshBox(0.52, 0.66, 0.3, model.matShirt);
  torsoMesh.position.y = 1.18; torso.add(torsoMesh);

  const headGroup = new THREE.Group();
  headGroup.position.y = 1.74; body.add(headGroup);
  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), model.matSkin);
  headMesh.castShadow = true; headGroup.add(headMesh);

  const faceGroup = new THREE.Group(); headGroup.add(faceGroup);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.026, 8, 8), model.matEye);
  eyeL.position.set(-0.07, 0.02, 0.18); faceGroup.add(eyeL);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.026, 8, 8), model.matEye);
  eyeR.position.set(0.07, 0.02, 0.18); faceGroup.add(eyeR);

  const browMat = new THREE.MeshBasicMaterial({ color: colors.hairColor || '#2a1d16' });
  const browL = meshBox(0.06, 0.012, 0.01, browMat);
  browL.position.set(-0.07, 0.075, 0.185); faceGroup.add(browL);
  const browR = meshBox(0.06, 0.012, 0.01, browMat);
  browR.position.set(0.07, 0.075, 0.185); faceGroup.add(browR);

  const mouthMesh = meshBox(0.06, 0.02, 0.01, model.matMouth);
  mouthMesh.position.set(0, -0.07, 0.19); faceGroup.add(mouthMesh);

  const cheekMatFace = new THREE.MeshBasicMaterial({ color: 0xff8f9f, transparent: true, opacity: 0.5 });
  const cL = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), cheekMatFace);
  cL.position.set(-0.11, -0.03, 0.16); faceGroup.add(cL);
  const cR = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), cheekMatFace);
  cR.position.set(0.11, -0.03, 0.16); faceGroup.add(cR);

  const hairGroup = new THREE.Group(); headGroup.add(hairGroup);

  function createArm(side) {
    const shoulder = new THREE.Group();
    shoulder.position.set(side * 0.36, 1.47, 0); body.add(shoulder);
    const upperArm = meshBox(0.14, 0.32, 0.14, model.matSkin);
    upperArm.position.y = -0.16; shoulder.add(upperArm);
    const elbow = new THREE.Group(); elbow.position.y = -0.32; shoulder.add(elbow);
    const foreArm = meshBox(0.13, 0.3, 0.13, model.matSkin);
    foreArm.position.y = -0.15; elbow.add(foreArm);
    const sleeve = meshBox(0.17, 0.24, 0.17, model.matShirt);
    sleeve.position.y = -0.11; shoulder.add(sleeve);
    return { shoulder, elbow };
  }
  function createLeg(side) {
    const hip = new THREE.Group();
    hip.position.set(side * 0.14, 0.86, 0); body.add(hip);
    const thigh = meshBox(0.2, 0.42, 0.2, model.matSkin);
    thigh.position.y = -0.21; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -0.42; hip.add(knee);
    const shin = meshBox(0.18, 0.44, 0.18, model.matSkin);
    shin.position.y = -0.22; knee.add(shin);
    const sock = meshBox(0.235, 0.4, 0.235, model.matSock);
    sock.position.y = -0.2; hip.add(sock);
    return { hip, knee, sock };
  }

  model.group = group;
  model.body = body;
  model.torsoMesh = torsoMesh;
  model.headGroup = headGroup;
  model.hairGroup = hairGroup;
  model.eyeL = eyeL; model.eyeR = eyeR;
  model.mouthMesh = mouthMesh;
  model.browMat = browMat;
  model.armL = createArm(-1);
  model.armR = createArm(1);
  model.legL = createLeg(-1);
  model.legR = createLeg(1);

  buildHairOn(model, colors.hair || 'short');
  applyFaceOn(model, colors);
  return model;
}

function buildHairOn(model, style) {
  const hg = model.hairGroup;
  while (hg.children.length) hg.remove(hg.children[0]);
  if (style === 'bald') return;
  const capMat = model.matHair;
  if (style === 'short') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.205, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), capMat);
    cap.position.y = 0.02; cap.rotation.x = -0.15; hg.add(cap);
    const bang = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, 0.06), capMat);
    bang.position.set(0, 0.13, 0.15); bang.rotation.x = -0.3; hg.add(bang);
  } else if (style === 'long') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.6), capMat);
    cap.position.y = 0.02; cap.rotation.x = -0.12; hg.add(cap);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.5, 0.12), capMat);
    back.position.set(0, -0.15, -0.13); back.castShadow = true; hg.add(back);
    for (const s of [-1, 1]) {
      const side = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.32, 0.14), capMat);
      side.position.set(s * 0.19, -0.05, -0.02); hg.add(side);
    }
  } else if (style === 'twin') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.205, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), capMat);
    cap.position.y = 0.02; cap.rotation.x = -0.15; hg.add(cap);
    for (const s of [-1, 1]) {
      const tailBase = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), capMat);
      tailBase.position.set(s * 0.19, 0.0, -0.05); hg.add(tailBase);
      const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.03, 0.4, 8), capMat);
      tail.position.set(s * 0.25, -0.2, -0.08); tail.rotation.z = s * 0.3; tail.castShadow = true; hg.add(tail);
    }
  } else if (style === 'bob') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.215, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.62), capMat);
    cap.position.y = 0.02; cap.rotation.x = -0.1; hg.add(cap);
    for (const s of [-1, 1]) {
      const side = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.22, 0.16), capMat);
      side.position.set(s * 0.2, -0.05, -0.02); side.castShadow = true; hg.add(side);
    }
  }
}

function applyFaceOn(model, colors) {
  model.eyeL.scale.set(1, 1, 1); model.eyeR.scale.set(1, 1, 1);
  model.eyeL.rotation.set(0, 0, 0); model.eyeR.rotation.set(0, 0, 0);
  model.eyeL.visible = true; model.eyeR.visible = true;
  if (colors.eyeShape === 'happy') { model.eyeL.scale.set(1, 0.5, 1); model.eyeR.scale.set(1, 0.5, 1); }
  else if (colors.eyeShape === 'sharp') { model.eyeL.rotation.z = 0.4; model.eyeR.rotation.z = -0.4; model.eyeL.scale.set(1, 0.8, 1); model.eyeR.scale.set(1, 0.8, 1); }
  else if (colors.eyeShape === 'closed') { model.eyeL.visible = false; model.eyeR.visible = false; }

  model.mouthMesh.scale.set(1, 1, 1);
  if (colors.mouth === 'smile') model.mouthMesh.scale.set(1.2, 0.6, 1);
  else if (colors.mouth === 'open') model.mouthMesh.scale.set(1, 2.2, 1);
  else if (colors.mouth === 'neutral') model.mouthMesh.scale.set(1, 0.4, 1);
  else if (colors.mouth === 'cat') model.mouthMesh.scale.set(1.2, 0.7, 1);
}

async function startGame() {
  if (gameStarted || !PLAYER_ID) return;
  const name = (nameInput.value || '').trim().slice(0, 16);
  if (!name) { alert('名前を入力してください'); return; }
  playerName = name;
  gameStarted = true;
  loginOverlay.classList.add('hidden');

  initThree();
  initWorld();
  initMyPlayer();
  applyMyCustomization();
  refreshCustomUI();
  updateAcornUI();
  applyHudVisibility();

  const myRef = ref(db, 'players/' + PLAYER_ID);
  await set(myRef, {
    name: playerName,
    x: 0, y: 0, z: 0, facing: 0,
    skinColor: custom.skinColor, shirtColor: custom.shirtColor, sockColor: custom.sockColor,
    hairColor: custom.hairColor, hair: custom.hair, eyeColor: custom.eyeColor,

// ============================================================
// Three.js 初期化
// ============================================================
function initThree() {
  if (typeof THREE === 'undefined') { alert('Three.js の読み込みに失敗しました。再読み込みしてください。'); return; }
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3ff);
  scene.fog = new THREE.Fog(0xbfe3ff, 60, 220);
  camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);

  scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6b8f4e, 1.05));
  sun = new THREE.DirectionalLight(0xfff6df, 1.25);
  sun.position.set(30, 40, 20); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 120 });
  sun.shadow.bias = -0.0005;
  scene.add(sun, sun.target);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));

  resize();
  addEventListener('resize', resize);
}

function resize() {
  if (!renderer) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function initWorld() {
  const groundGeo = new THREE.PlaneGeometry(600, 600, 60, 60);
  groundGeo.rotateX(-Math.PI / 2);
  const gpos = groundGeo.attributes.position;
  for (let i = 0; i < gpos.count; i++) {
    const x = gpos.getX(i), z = gpos.getZ(i);
    const d = Math.hypot(x, z);
    const h = (Math.sin(x * 0.05) * Math.cos(z * 0.05) * 1.6 + Math.sin(x * 0.15 + z * 0.1) * 0.4) * Math.min(1, Math.max(0, (d - 15) / 40));
    gpos.setY(i, h);
  }
  groundGeo.computeVertexNormals();
  const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x6fae4a, roughness: 1 }));
  ground.receiveShadow = true; scene.add(ground);

  (function addGrassField() {
    const g = new THREE.BufferGeometry();
    const N = 4000, arr = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, r = 18 + Math.random() * 140;
      arr[i * 3] = Math.cos(a) * r; arr[i * 3 + 1] = 0.05; arr[i * 3 + 2] = Math.sin(a) * r;
    }
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    const m = new THREE.PointsMaterial({ color: 0x4f8f35, size: 0.5, sizeAttenuation: true, transparent: true, opacity: 0.8 });
    const p = new THREE.Points(g, m); p.position.y = 0.02; scene.add(p);
  })();

  const grid = new THREE.GridHelper(600, 300, 0x8fbf6a, 0x7aa85a);
  grid.position.y = 0.02; grid.material.opacity = 0.25; grid.material.transparent = true; scene.add(grid);

  buildTreesAndScenery();
  buildFairies();
  buildHouse();
}

function makeTree(x, z, scale = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const trunkH = 2.2 * scale;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * scale, 0.24 * scale, trunkH, 7), new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 1 }));
  trunk.position.y = trunkH / 2; trunk.castShadow = true; trunk.receiveShadow = true; g.add(trunk);
  const mats = [
    new THREE.MeshStandardMaterial({ color: 0x3f8f3a, roughness: 0.9 }),
    new THREE.MeshStandardMaterial({ color: 0x4fa64a, roughness: 0.9 }),
    new THREE.MeshStandardMaterial({ color: 0x5fbf55, roughness: 0.9 }),
  ];
  [[0,trunkH+0.7*scale,0,1.1*scale],[0.7*scale,trunkH+0.4*scale,0.4*scale,0.8*scale],[-0.6*scale,trunkH+0.5*scale,-0.5*scale,0.85*scale],[0.2*scale,trunkH+1.2*scale,-0.3*scale,0.7*scale]].forEach((b, i) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(b[3], 10, 8), mats[i % 3]);
    m.position.set(b[0], b[1], b[2]); m.castShadow = true; m.receiveShadow = true; g.add(m);
  });
  scene.add(g); return g;
}

function makeOakTree(x, z, scale = 1) {
  const g = makeTree(x, z, scale);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.9 });
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc68b3c, roughness: 0.8 });
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * Math.PI * 2, r = (0.6 + Math.random() * 0.6) * scale;
    const acorn = new THREE.Group();
    acorn.position.set(Math.cos(a) * r, 2.8 * scale + Math.random() * 0.5, Math.sin(a) * r);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.12 * scale, 8, 6), bodyMat);
    b.scale.y = 1.3; b.position.y = -0.08 * scale; acorn.add(b);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.13 * scale, 8, 6, 0, Math.PI * 2, 0, Math.PI * 0.5), capMat);
    cap.position.y = 0.03 * scale; acorn.add(cap);
    g.add(acorn);
  }
  return g;
}

function makeBush(x, z, scale = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const mat = new THREE.MeshStandardMaterial({ color: 0x4f9f45, roughness: 1 });
  for (let i = 0; i < 4; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry((0.35 + Math.random() * 0.25) * scale, 8, 6), mat);
    m.position.set((Math.random() - 0.5) * 0.8 * scale, 0.35 * scale, (Math.random() - 0.5) * 0.8 * scale);
    m.castShadow = true; m.receiveShadow = true; g.add(m);
  }
  scene.add(g);
}

function makeFlowerPatch(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const colors = [0xff6b8a, 0xffd166, 0xffffff, 0xb388ff, 0xff9f68];
  for (let i = 0; i < 14; i++) {

    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 4), new THREE.MeshStandardMaterial({ color: 0x3f8f3a }));
    stem.position.set(Math.cos(a) * r, 0.17, Math.sin(a) * r); g.add(stem);
    const petal = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 5), new THREE.MeshStandardMaterial({ color: colors[i % colors.length], roughness: 0.7 }));
    petal.position.set(Math.cos(a) * r, 0.38, Math.sin(a) * r); g.add(petal);

}

function makeRock(x, z, s = 1) {
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6 * s, 0), new THREE.MeshStandardMaterial({ color: 0x9a9a92, roughness: 1 }));
  m.position.set(x, 0.3 * s, z); m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);

}

function makeHill(x, z, r, h) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5f9f4f, roughness: 1 }));
  m.position.set(x, -r + h, z); m.scale.y = h / r; m.receiveShadow = true; scene.add(m);

function buildTreesAndScenery() {
  const FC = new THREE.Vector3(-22, 0, 18);
  for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2, r = 10 + Math.sin(i * 1.7) * 2.5; makeOakTree(FC.x + Math.cos(a) * r, FC.z + Math.sin(a) * r, 1.0 + Math.random() * 0.5); }
  for (let i = 0; i < 10; i++) { const a = Math.random() * Math.PI * 2, r = Math.random() * 7; makeOakTree(FC.x + Math.cos(a) * r, FC.z + Math.sin(a) * r, 0.9 + Math.random() * 0.4); }
  [[-16,-6,1.3],[-20,4,1.1],[-13,12,1.0],[-24,-14,1.5],[-10,-20,1.2],[16,10,1.2],[22,-2,1.4],[18,-18,1.1],[26,12,1.3],[30,-12,1.5],[-4,-22,1.1],[8,16,1.0],[-28,20,1.4],[36,4,1.6],[-32,-8,1.2],[2,6,1.0],[-2,-6,1.1],[14,4,1.2],[-6,10,1.0]].forEach(([x,z,s]) => makeTree(x, z, s));
  [[-6,6,1],[10,4,1.2],[14,-4,1],[-14,-2,1.1],[4,-16,1],[20,2,1.3],[-18,14,1.1],[28,-4,1.2],[0,10,1],[6,10,1]].forEach(([x,z,s]) => makeBush(x, z, s));
  [[-8,2],[-3,8],[9,8],[-12,-8],[12,-12],[-2,-10],[18,6],[-20,2],[6,14],[-16,-16],[0,-14],[2,2],[10,10],[-9,15]].forEach(([x,z]) => makeFlowerPatch(x, z));
  [[-10,10,1],[15,-8,1.3],[24,4,0.9],[-18,-4,1.1],[8,-14,1],[-6,-16,0.8],[12,16,1.2],[-4,4,0.8]].forEach(([x,z,s]) => makeRock(x, z, s));
  makeHill(-70,-60,35,18); makeHill(70,-80,45,22); makeHill(-80,60,40,16); makeHill(90,50,50,20); makeHill(0,-120,60,26);
}

// ============================================================
// コリジョン登録ヘルパー
// ============================================================
function addCollider(cx, cy, cz, w, h, d) {
  colliders.push({
    minX: cx - w/2, maxX: cx + w/2,
    minY: cy - h/2, maxY: cy + h/2,
    minZ: cz - d/2, maxZ: cz + d/2
  });
}
// 家ローカル座標→ワールド座標
function houseLocalToWorld(lx, lz) {
  const ang = -0.35;
  const wx = houseOrigin.x + lx * Math.cos(ang) + lz * Math.sin(ang);
  const wz = houseOrigin.z - lx * Math.sin(ang) + lz * Math.cos(ang);
  return [wx, wz];
}
// 家ローカルのコライダー登録
function addHouseCollider(lx, ly, lz, w, h, d) {
  const ang = -0.35;
  // 回転を考慮した AABB（簡易：回転後の外接矩形）
  // ここでは壁が軸に沿うよう家を回転させているので、回転後のAABBで近似
  const [wx, wz] = houseLocalToWorld(lx, lz);
  // 回転を無視してAABBを取ると不正確になるため、壁を軸並行に配置する
  // 家全体は回転させず、装飾のみ回転させる方針に変更
  colliders.push({
    minX: wx - w/2, maxX: wx + w/2,
    minY: houseOrigin.y + ly - h/2, maxY: houseOrigin.y + ly + h/2,
    minZ: wz - d/2, maxZ: wz + d/2
  });
}

// ============================================================
// 家（高レベル版・内外装＋当たり判定）
// ============================================================
function buildHouse() {
  houseOrigin.set(14, 0, 6);
  const HX = houseOrigin.x, HZ = houseOrigin.z;
  const house = new THREE.Group();
  house.position.set(HX, 0, HZ);
  scene.add(house);

  // マテリアル
  const matStone = new THREE.MeshStandardMaterial({ color: 0x8a8a82, roughness: 1 });
  const matStoneDark = new THREE.MeshStandardMaterial({ color: 0x6a6a62, roughness: 1 });
  const matWall = new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.9 });
  const matTimber = new THREE.MeshStandardMaterial({ color: 0x5a3a20, roughness: 0.9 });
  const matRoof = new THREE.MeshStandardMaterial({ color: 0x8a3b2e, roughness: 0.85 });
  const matRoofDark = new THREE.MeshStandardMaterial({ color: 0x6a2b1e, roughness: 0.9 });
  const matFloor = new THREE.MeshStandardMaterial({ color: 0x9c6b3f, roughness: 0.85 });
  const matFloorDark = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.9 });
  const matWindow = new THREE.MeshStandardMaterial({ color: 0xbfe3ff, roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.55 });
  const matDoor = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.85 });
  const matBrick = new THREE.MeshStandardMaterial({ color: 0xa0503a, roughness: 0.95 });
  const matFabric = new THREE.MeshStandardMaterial({ color: 0xc84a5a, roughness: 1 });
  const matWoodLight = new THREE.MeshStandardMaterial({ color: 0xb98a5a, roughness: 0.9 });
  const matLamp = new THREE.MeshStandardMaterial({ color: 0xffe8a0, emissive: 0xffcc55, emissiveIntensity: 1.2 });

  // 家の寸法
  const W = 10, D = 8;          // 外壁
  const wallH = 3.2;            // 1階の高さ
  const wallT = 0.3;            // 壁の厚み
  const floor2Y = 3.2;          // 2階の床
  const wall2H = 2.6;           // 2階の高さ
  const roofBaseY = floor2Y + wall2H;

  function box(w, h, d, x, y, z, mat, parent = house) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    parent.add(m);
    return m;
  }

  // ===== 石の土台 =====
  box(W + 0.4, 0.4, D + 0.4, 0, 0.2, 0, matStone);
  // 土台の石目
  for (let i = 0; i < 8; i++) {
    box(W + 0.42, 0.08, D + 0.42, 0, 0.1 + i * 0.05, 0, matStoneDark);
  }

  // ===== 1階の外壁（4面、ドアと窓の開口部を空ける） =====
  // 南面（正面 +Z側）: ドア中央、両側に窓
  // 壁を分割して開口部を作る
  // 南面左
  box((W - 2.4)/2 - 0.4, wallH, wallT, -(W/4 + 0.6), wallH/2 + 0.4, D/2, matWall);
  // 南面右
  box((W - 2.4)/2 - 0.4, wallH, wallT, (W/4 + 0.6), wallH/2 + 0.4, D/2, matWall);
  // ドア上部（鴨居）
  box(2.4, wallH - 2.2, wallT, 0, 2.2 + (wallH - 2.2)/2 + 0.4, D/2, matWall);
  // 窓上部・下部は壁で埋める（窓は透過オブジェクトとして別途）
  // 北面（背面 -Z側）
  box(W, wallH, wallT, 0, wallH/2 + 0.4, -D/2, matWall);
  // 東面（+X側）
  box(wallT, wallH, D, W/2, wallH/2 + 0.4, 0, matWall);
  // 西面（-X側）
  box(wallT, wallH, D, -W/2, wallH/2 + 0.4, 0, matWall);

  // 外壁のコライダー（開口部を考慮）
  // 南面左
  addHouseCollider(-(W/4 + 0.6), wallH/2 + 0.4, D/2, (W - 2.4)/2 - 0.4, wallH, wallT);
  // 南面右
  addHouseCollider((W/4 + 0.6), wallH/2 + 0.4, D/2, (W - 2.4)/2 - 0.4, wallH, wallT);
  // 南面ドア上部（通り抜け不可にしないため、ドア部分はコライダーなし）
  // 北面
  addHouseCollider(0, wallH/2 + 0.4, -D/2, W, wallH, wallT);
  // 東面
  addHouseCollider(W/2, wallH/2 + 0.4, 0, wallT, wallH, D);
  // 西面
  addHouseCollider(-W/2, wallH/2 + 0.4, 0, wallT, wallH, D);

  // ===== 木骨（ハーフティンバー）装飾 =====
  const timberPositions = [
    // 南面
    [-W/2+0.15, wallH/2+0.4, D/2+0.16, 0.15, wallH, 0.05],
    [W/2-0.15, wallH/2+0.4, D/2+0.16, 0.15, wallH, 0.05],
    [-W/4-0.6, wallH/2+0.4, D/2+0.16, 0.12, wallH, 0.05],
    [W/4+0.6, wallH/2+0.4, D/2+0.16, 0.12, wallH, 0.05],
    // 北面
    [-W/2+0.15, wallH/2+0.4, -D/2-0.16, 0.15, wallH, 0.05],
    [W/2-0.15, wallH/2+0.4, -D/2-0.16, 0.15, wallH, 0.05],
    // 東面
    [W/2+0.16, wallH/2+0.4, -D/2+0.15, 0.05, wallH, 0.15],
    [W/2+0.16, wallH/2+0.4, D/2-0.15, 0.05, wallH, 0.15],
    // 西面
    [-W/2-0.16, wallH/2+0.4, -D/2+0.15, 0.05, wallH, 0.15],
    [-W/2-0.16, wallH/2+0.4, D/2-0.15, 0.05, wallH, 0.15],
  ];
  timberPositions.forEach(([x,y,z,w,h,d]) => box(w, h, d, x, y, z, matTimber));
  // 横の梁
  box(W, 0.2, 0.1, 0, wallH + 0.3, D/2 + 0.16, matTimber);
  box(W, 0.2, 0.1, 0, wallH + 0.3, -D/2 - 0.16, matTimber);

  dk.position.set(0.55, 1.4, D/2 + 0.12);

  // ===== 窓（1階・2階） =====
  function windowAt(x, y, z, w, h, rotY = 0) {

    // ガラス

    const bot = new THREE.Mesh(new THREE.BoxGeometry(w + fw*2, fw, 0.12), frameMat); bot.position.y = -h/2 - fw/2; g.add(bot);
    const left = new THREE.Mesh(new THREE.BoxGeometry(fw, h, 0.12), frameMat); left.position.x = -w/2 - fw/2; g.add(left);

  // ===== 階段（1階→2階） =====

  const stairX = W/2 - 1.4;

  // ===== 家具：暖炉 =====

  // ===== 外灯（ポーチ） =====
  const porchLamp = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), matLamp);

  // ===== 周囲の花壇 =====
  for (const [ox, oz] of [[-W/2-1, D/2+0.5], [W/2+1, D/2+0.5], [-W/2-1, -D/2-0.5], [W/2+1, -D/2-0.5]]) {
    makeFlowerPatch(HX + ox, HZ + oz);
  }

  // ===== 看板 =====
  const signPost = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.4, 6), matTimber);
  signPost.position.set(HX + W/2 + 1.5, 0.7, HZ + D/2 + 1.5);

  // 家全体のコライダーを更新（内部も含む）

// ============================================================
// コリジョン判定
// ============================================================
const PLAYER_RADIUS = 0.35;
const PLAYER_HEIGHT = 1.8;

function collidesAt(x, y, z) {
  const pr = PLAYER_RADIUS;
  const pyMin = y + 0.1; // 足元少し上から
  const pyMax = y + PLAYER_HEIGHT;
  for (const c of colliders) {
    if (x + pr > c.minX && x - pr < c.maxX &&
        pyMax > c.minY && pyMin < c.maxY &&
        z + pr > c.minZ && z - pr < c.maxZ) {
      return true;
    }
  }
  return false;
}

// プレイヤーが立つ床の高さを返す（家の2階、階段に対応）
function getFloorHeight(x, z) {
  // 家の中かどうか
  const dx = x - houseOrigin.x, dz = z - houseOrigin.z;
  const W = 10, D = 8;
  const inHouse = Math.abs(dx) < W/2 - 0.2 && Math.abs(dz) < D/2 - 0.2;

  let floorY = 0;

  // 階段の上なら階段の高さ
  const stairX = W/2 - 1.4, stairZ = -D/2 + 2.0, stairW = 1.4, stairD = 3.0, steps = 10;
  const stepD = stairD / steps;
  const localX = dx, localZ = dz;
  if (Math.abs(localX - stairX) < stairW/2 && localZ > stairZ - stepD/2 && localZ < stairZ + stairD + stepD/2) {
    const idx = Math.floor((localZ - (stairZ - stepD/2)) / stepD);
    if (idx >= 0 && idx < steps) {
      const stepH = (3.2 - 0.5) / steps;
      floorY = Math.max(floorY, 0.5 + (idx + 1) * stepH);
    }
  }

  // 2階の床
  if (inHouse && Math.abs(localZ) < D/2 - 0.4 && Math.abs(localX) < W/2 - 0.4) {
    // 階段の上端付近以外は2階の床
    if (localX < stairX - stairW/2 || localZ < stairZ - stepD/2) {
      floorY = Math.max(floorY, 3.2);
    }
  }

  return floorY;
}

function initMyPlayer() {
  myModel = buildCharacterModel({

    eyeShape: custom.eyeShape, mouth: custom.mouth
  });
  scene.add(myModel.group);

function createRemotePlayer(uid, data) {
  const model = buildCharacterModel(data);
  scene.add(model.group);
  const rp = {
    group: model.group,
    model,
    target: null,
    current: {
      alx:0,aly:0,alz:0,aex:0, arx:0,ary:0,arz:0,aex2:0,
      llx:0,lly:0,llz:0,lkx:0,lky:0, rlx:0,rly:0,rlz:0,rkx:0,rky:0,
      bx:0,by:0,bz:0, bpy:0, hx:0,hy:0,hz:0
    },
    _hair: data.hair, _eyeShape: data.eyeShape, _mouth: data.mouth
  };
  remotePlayers[uid] = rp;
  return rp;
}

function removeRemotePlayer(uid) {
  const rp = remotePlayers[uid];
  if (rp) { scene.remove(rp.group); delete remotePlayers[uid]; }
}

function applyRot(rp, r) {
  if (!r) return;
  const m = rp.model;
  m.armL.shoulder.rotation.set(r.alx||0, r.aly||0, r.alz||0);
  m.armL.elbow.rotation.x = r.aex||0;
  m.armR.shoulder.rotation.set(r.arx||0, r.ary||0, r.arz||0);
  m.armR.elbow.rotation.x = r.aex2||0;
  m.legL.hip.rotation.set(r.llx||0, r.lly||0, r.llz||0);
  m.legL.knee.rotation.set(r.lkx||0, r.lky||0, 0);
  m.legR.hip.rotation.set(r.rlx||0, r.rly||0, r.rlz||0);
  m.legR.knee.rotation.set(r.rkx||0, r.rky||0, 0);
  m.body.rotation.set(r.bx||0, r.by||0, r.bz||0);
  m.body.position.y = r.bpy||0;
  m.headGroup.rotation.set(r.hx||0, r.hy||0, r.hz||0);
}

function lerpRot(cur, tgt, t) {
  for (const k in tgt) {
    if (cur[k] === undefined) cur[k] = tgt[k];
    cur[k] += (tgt[k] - cur[k]) * t;
  }
}

function setupRemotePlayersListener() {
  onValue(ref(db, 'players'), (snapshot) => {
    const data = snapshot.val() || {};
    const now = Date.now();

    let count = 0;
    for (const uid in data) {
      if (data[uid] && (now - (data[uid].lastSeen || 0)) < 30000) count++;
    }
    onlineCountEl.textContent = Math.max(1, count);

    for (const uid in data) {
      if (uid === PLAYER_ID) continue;
      const p = data[uid];
      if (!p) { removeRemotePlayer(uid); continue; }
      if (now - (p.lastSeen || 0) > 30000) { removeRemotePlayer(uid); continue; }

      let rp = remotePlayers[uid];
      if (!rp) rp = createRemotePlayer(uid, p);

      const m = rp.model;
      m.matSkin.color.set(p.skinColor || '#b97a4b');
      m.matShirt.color.set(p.shirtColor || '#1b2a5c');
      m.matSock.color.set(p.sockColor || '#f5f5f5');
      m.matHair.color.set(p.hairColor || '#2a1d16');
      m.matEye.color.set(p.eyeColor || '#111111');
      m.browMat.color.set(p.hairColor || '#2a1d16');

      if (rp._hair !== p.hair) { buildHairOn(m, p.hair || 'short'); rp._hair = p.hair; }
      if (rp._eyeShape !== p.eyeShape || rp._mouth !== p.mouth) {
        applyFaceOn(m, { eyeShape: p.eyeShape, mouth: p.mouth });
        rp._eyeShape = p.eyeShape; rp._mouth = p.mouth;
      }

      rp.group.position.set(p.x || 0, p.y || 0, p.z || 0);
      rp.group.rotation.y = p.facing || 0;
      if (p.rot) rp.target = p.rot;
    }
  });
}

function updateRemotePlayers(dt) {
  const t = Math.min(1, dt * 18);
  for (const uid in remotePlayers) {
    const rp = remotePlayers[uid];
    if (!rp.target) continue;
    lerpRot(rp.current, rp.target, t);
    applyRot(rp, rp.current);
  }
}

// チャット
// ============================================================
function setupChatListener() {
  const q = query(ref(db, 'chat'), limitToLast(50));
  onChildAdded(q, (snapshot) => {
    const msg = snapshot.val();
    if (!msg || !msg.uid) return;
    if (msg.uid === PLAYER_ID) return;
    showRemoteBubble(msg.uid, msg.name || 'ゲスト', msg.text, 5000);
    addChatLog(msg.name || 'ゲスト', msg.text);
  });
}

function addChatLog(name, text) { chatLog.push({ name, text }); if (chatLog.length > 30) chatLog.shift(); }

function showLocalBubble(text, duration = 4000) {
  if (localBubble) localBubble.el.remove();
  const el = document.createElement('div');
  el.className = 'bubble';
  el.textContent = text;
  document.body.appendChild(el);
  localBubble = { el, life: duration / 1000, age: 0 };
}

function showRemoteBubble(uid, name, text, duration) {
  const el = document.createElement('div');
  el.className = 'bubble';
  el.innerHTML = `<div class="name">${escapeHtml(name)}</div>${escapeHtml(text)}`;
  document.body.appendChild(el);
  remoteBubbles.push({ el, uid, life: duration / 1000, age: 0 });
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function updateBubbles(dt) {
  const v = new THREE.Vector3();
  if (localBubble) {
    localBubble.age += dt;
    v.set(myModel.group.position.x, myModel.group.position.y + 2.25, myModel.group.position.z);
    v.project(camera);
    if (v.z > 1) localBubble.el.style.opacity = '0';
    else {
      localBubble.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
      localBubble.el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
      localBubble.el.style.opacity = Math.min(1, (localBubble.life - localBubble.age) * 2).toFixed(2);
    }
    if (localBubble.age >= localBubble.life) { localBubble.el.remove(); localBubble = null; }
  }
  for (let i = remoteBubbles.length - 1; i >= 0; i--) {
    const b = remoteBubbles[i];
    b.age += dt;
    const rp = remotePlayers[b.uid];
    if (!rp) { b.el.remove(); remoteBubbles.splice(i, 1); continue; }
    v.set(rp.group.position.x, rp.group.position.y + 2.3, rp.group.position.z);
    v.project(camera);
    if (v.z > 1) b.el.style.opacity = '0';
    else {
      b.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
      b.el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
      b.el.style.opacity = Math.min(1, (b.life - b.age) * 2).toFixed(2);
    }
    if (b.age >= b.life) { b.el.remove(); remoteBubbles.splice(i, 1); }
  }
}

function sendChatMessage(text) {
  push(ref(db, 'chat'), { uid: PLAYER_ID, name: playerName, text, time: Date.now() }).catch(err => console.error(err));
}

// ============================================================
// 入力
// ============================================================
function setupInput() {
  addEventListener('keydown', (e) => {
    if (document.activeElement === chatInput) { if (e.key === 'Escape') closeChat(); return; }
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'KeyC' && !e.repeat) toggleSit();
    if (e.code === 'KeyE' && !e.repeat) toggleEmotePanel();
    if (e.code === 'KeyT' && !e.repeat) { e.preventDefault(); openChat(); }
  });
  addEventListener('keyup', (e) => { keys[e.code] = false; });

  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  let stickId = null;
  function stickMove(e) {
    const r = stick.getBoundingClientRect();
    let dx = e.clientX - (r.left + 60), dy = e.clientY - (r.top + 60);
    const l = Math.hypot(dx, dy), m = 45;
    if (l > m) { dx *= m / l; dy *= m / l; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx / m; joy.y = -dy / m;
  }
  stick.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
  stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) stickMove(e); });
  const stickEnd = (e) => { if (e.pointerId === stickId) { stickId = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
  stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);

  const jb = document.getElementById('jump');
  jb.addEventListener('pointerdown', () => jumpBtn = true);
  jb.addEventListener('pointerup', () => jumpBtn = false);

  const ptrs = new Map();
  canvas.addEventListener('pointerdown', (e) => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    yaw -= (e.clientX - p[0]) * 0.006;
    pitch = Math.min(1.35, Math.max(-0.1, pitch + (e.clientY - p[1]) * 0.005));
    p[0] = e.clientX; p[1] = e.clientY;
  });
  const up = (e) => ptrs.delete(e.pointerId);
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); dist = Math.min(20, Math.max(2.5, dist + e.deltaY * 0.01)); }, { passive: false });
}

// ============================================================
// ローカルポーズ計算（コリジョン対応）
// ============================================================
function computeLocalPose(now, dt) {
  const chatting = document.activeElement === chatInput;
  let ix = 0, iz = 0;
  if (!chatting) {
    ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
    iz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + joy.y;
  }
  const mag = Math.min(1, Math.hypot(ix, iz));
  if (mag > 0.05 && sitting) { sitting = false; document.getElementById('sitBtn').textContent = 'あぐら'; }
  if (mag > 0.05 && emoteName && emoteName !== 'dance') emoteName = null;

  const run = keys.ShiftLeft || keys.ShiftRight || (mag > 0.9 && joy.y !== 0 && Math.hypot(joy.x, joy.y) > 0.95);
  const speed = (run ? 8 : 4) * mag;
  const canMove = !sitting && !emoteName && !chatting;

  const g = myModel.group;
  // 水平移動（X/Z軸分離でスライド）
  if (canMove && mag > 0) {
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let dx = fx * iz + rx * ix, dz = fz * iz + rz * ix;
    const l = Math.hypot(dx, dz); dx /= l; dz /= l;

    const stepX = dx * speed * dt;
    const stepZ = dz * speed * dt;
    const floorY = getFloorHeight(g.position.x, g.position.z);
    // X方向
    if (!collidesAt(g.position.x + stepX, floorY, g.position.z)) {
      g.position.x += stepX;
    }
    // Z方向
    if (!collidesAt(g.position.x, floorY, g.position.z + stepZ)) {
      g.position.z += stepZ;
    }
    // 速度更新（表示用）
    vel.x = dx * speed;
    vel.z = dz * speed;
    const target = Math.atan2(dx, dz);
    let d = target - facing; d = Math.atan2(Math.sin(d), Math.cos(d));
    facing += d * Math.min(1, dt * 12);
  } else {
    vel.x *= Math.max(0, 1 - dt * 10);
    vel.z *= Math.max(0, 1 - dt * 10);
  }

  // ジャンプ
  const floorY = getFloorHeight(g.position.x, g.position.z);
  if ((keys.Space || jumpBtn) && onGround && !sitting && !emoteName && !chatting) { vy = 7; onGround = false; }
  vy -= 20 * dt;
  g.position.y += vy * dt;

  // 着地判定（床の高さに応じて）
  if (g.position.y <= floorY) {
    g.position.y = floorY;
    vy = 0;
    onGround = true;
  } else {
    onGround = false;
  }

  g.rotation.y = facing;

  const sp = Math.hypot(vel.x, vel.z);
  phase += dt * (sp * 1.6);
  const amp = Math.min(1, sp / 4) * (sp > 6 ? 0.95 : 0.65);
  const swing = Math.sin(phase) * amp;

  const m = myModel;
  m.armL.shoulder.rotation.set(0,0,0); m.armR.shoulder.rotation.set(0,0,0);
  m.armL.elbow.rotation.set(0,0,0); m.armR.elbow.rotation.set(0,0,0);
  m.legL.hip.rotation.set(0,0,0); m.legR.hip.rotation.set(0,0,0);
  m.legL.knee.rotation.set(0,0,0); m.legR.knee.rotation.set(0,0,0);
  m.body.rotation.set(0,0,0); m.body.position.y = 0;
  m.legL.hip.position.set(-0.14, 0.86, 0);
  m.legR.hip.position.set(0.14, 0.86, 0);
  m.headGroup.rotation.set(0,0,0);

  if (sitting) {
    m.body.position.y = -0.55;
    m.legL.hip.rotation.y = 1.1; m.legR.hip.rotation.y = -1.1;
    m.legL.hip.rotation.x = -1.35; m.legR.hip.rotation.x = -1.35;
    m.legL.hip.rotation.z = 0.15; m.legR.hip.rotation.z = -0.15;
    m.legL.knee.rotation.x = 2.0; m.legL.knee.rotation.y = -0.6;
    m.legR.knee.rotation.x = 2.0; m.legR.knee.rotation.y = 0.6;
    m.armL.shoulder.rotation.x = -0.6; m.armR.shoulder.rotation.x = -0.6;
    m.armL.shoulder.rotation.z = -0.25; m.armR.shoulder.rotation.z = 0.25;
    m.armL.elbow.rotation.x = -0.7; m.armR.elbow.rotation.x = -0.7;
    m.body.rotation.x = 0.08;
  } else if (emoteName) {
    emoteTime += dt;
    const et = emoteTime;
    if (emoteName === 'wave') {
      m.armR.shoulder.rotation.x = -2.6;
      m.armR.shoulder.rotation.z = 0.3 + Math.sin(et * 10) * 0.5;
      m.armR.elbow.rotation.x = -0.2;
      m.armL.shoulder.rotation.x = swing * -0.3;
      m.armL.elbow.rotation.x = -0.3;
      if (et > 2.2) emoteName = null;
    } else if (emoteName === 'cheer') {
      m.body.position.y = Math.abs(Math.sin(et * 6)) * 0.15;
      m.armL.shoulder.rotation.x = -2.8; m.armR.shoulder.rotation.x = -2.8;
      m.armL.shoulder.rotation.z = -0.25; m.armR.shoulder.rotation.z = 0.25;
      if (et > 1.8) emoteName = null;
    } else if (emoteName === 'dance') {
      m.body.position.y = Math.abs(Math.sin(et * 5)) * 0.08;
      m.body.rotation.x = Math.sin(et * 5) * 0.15;
      m.body.rotation.y = Math.sin(et * 5) * 0.3;
      m.armL.shoulder.rotation.x = -1.8 + Math.sin(et * 6) * 0.5;
      m.armR.shoulder.rotation.x = -1.8 - Math.sin(et * 6) * 0.5;
      m.armL.shoulder.rotation.z = -0.6; m.armR.shoulder.rotation.z = 0.6;
      if (et > 3.5) { emoteName = null; m.body.rotation.y = 0; }
    } else if (emoteName === 'think') {
      m.armR.shoulder.rotation.x = -1.9; m.armR.shoulder.rotation.z = 0.5;
      m.armR.elbow.rotation.x = -1.9;
      m.armL.shoulder.rotation.x = -0.2; m.armL.elbow.rotation.x = -0.5;
      m.headGroup.rotation.z = 0.25; m.headGroup.rotation.x = 0.1;
      if (et > 2.5) { emoteName = null; m.headGroup.rotation.set(0,0,0); }
    } else if (emoteName === 'stretch') {
      const p = Math.min(1, et * 2);
      m.body.position.y = Math.sin(p * Math.PI) * 0.1;
      m.armL.shoulder.rotation.x = -3; m.armR.shoulder.rotation.x = -3;
      m.body.rotation.x = -Math.sin(p * Math.PI) * 0.12;
      if (et > 2.5) emoteName = null;
    }
  } else {
    if (!onGround) {
      m.armL.shoulder.rotation.x = -2.4; m.armR.shoulder.rotation.x = -2.4;
      m.legL.hip.rotation.x = -0.5; m.legR.hip.rotation.x = 0.4;
    } else {
      m.legL.hip.rotation.x = swing; m.legR.hip.rotation.x = -swing;
      m.legL.knee.rotation.x = Math.max(0, -swing * 0.8);
      m.legR.knee.rotation.x = Math.max(0, swing * 0.8);
      m.armL.shoulder.rotation.x = -swing * 0.9; m.armR.shoulder.rotation.x = swing * 0.9;
      m.armL.elbow.rotation.x = -0.3 - Math.abs(swing) * 0.3;
      m.armR.elbow.rotation.x = -0.3 - Math.abs(swing) * 0.3;
    }
    m.body.position.y = onGround ? Math.abs(Math.cos(phase)) * 0.06 * amp + Math.sin(now / 500) * 0.008 : 0;
    m.body.rotation.x = Math.min(0.2, sp * 0.025);
  }
}

// ============================================================
// Firebase 同期
// ============================================================
function syncMyState(dt) {
  if (!PLAYER_ID || !myModel) return;
  lastSync += dt;
  if (lastSync < SYNC_INTERVAL) return;
  lastSync = 0;
  const m = myModel;
  let pose = 'stand';
  if (sitting) pose = 'sit';
  else if (emoteName) pose = 'emote_' + emoteName;
  else if (!onGround) pose = 'jump';
  else if (Math.hypot(vel.x, vel.z) > 0.1) pose = 'walk';

  update(ref(db, 'players/' + PLAYER_ID), {
    x: m.group.position.x, y: m.group.position.y, z: m.group.position.z,
    facing: facing, pose, lastSeen: Date.now(),
    rot: {
      alx: m.armL.shoulder.rotation.x, aly: m.armL.shoulder.rotation.y, alz: m.armL.shoulder.rotation.z, aex: m.armL.elbow.rotation.x,
      arx: m.armR.shoulder.rotation.x, ary: m.armR.shoulder.rotation.y, arz: m.armR.shoulder.rotation.z, aex2: m.armR.elbow.rotation.x,
      llx: m.legL.hip.rotation.x, lly: m.legL.hip.rotation.y, llz: m.legL.hip.rotation.z, lkx: m.legL.knee.rotation.x, lky: m.legL.knee.rotation.y,
      rlx: m.legR.hip.rotation.x, rly: m.legR.hip.rotation.y, rlz: m.legR.hip.rotation.z, rkx: m.legR.knee.rotation.x, rky: m.legR.knee.rotation.y,
      bx: m.body.rotation.x, by: m.body.rotation.y, bz: m.body.rotation.z, bpy: m.body.position.y,
      hx: m.headGroup.rotation.x, hy: m.headGroup.rotation.y, hz: m.headGroup.rotation.z
    }
  }).catch(() => {});
}

// ============================================================
// メインループ
// ============================================================
function loop(now) {
  requestAnimationFrame(loop);
  if (!renderer || !gameStarted || !myModel) return;

  const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
  lastTime = now;

  computeLocalPose(now, dt);

  fairies.forEach(f => {
    if (f.collected) return;
    const bob = Math.sin(now / 500 + f.phase) * 0.12;
    f.group.position.y = 0.6 + bob;
    f.group.rotation.y += dt * 0.8;
    if (f.aura) {
      const s = 1 + Math.sin(now / 333 + f.phase) * 0.15;
      f.aura.scale.set(s, s, s);
      f.aura.material.opacity = 0.1 + Math.sin(now / 333 + f.phase) * 0.05;
    }
    const dx = myModel.group.position.x - f.group.position.x;
    const dz = myModel.group.position.z - f.group.position.z;
    if (Math.hypot(dx, dz) < 1.3 && Math.abs(myModel.group.position.y - 0.5) < 1.5) {
      f.collected = true; f.group.visible = false;
      acornCount++; updateAcornUI(); showToast('🌰 どんぐりをゲット！');
    }
  });

  updateRemotePlayers(dt);

  const tx = myModel.group.position.x, ty = myModel.group.position.y + 1.2, tz = myModel.group.position.z;
  camera.position.set(
    tx + Math.sin(yaw) * Math.cos(pitch) * dist,
    ty + Math.sin(pitch) * dist,
    tz + Math.cos(yaw) * Math.cos(pitch) * dist
  );
  if (camera.position.y < 0.3) camera.position.y = 0.3;
  camera.lookAt(tx, ty, tz);
  sun.position.set(tx + 30, 40, tz + 20);
  sun.target.position.set(tx, 0, tz);
  posEl.innerHTML = `<br><small>X ${tx.toFixed(1)}　Y ${myModel.group.position.y.toFixed(1)}　Z ${tz.toFixed(1)}</small>`;

  updateBubbles(dt);
  syncMyState(dt);

  saveLocalTimer += dt;
  if (saveLocalTimer > 1) { saveLocalTimer = 0; saveLocal(); }

  renderer.render(scene, camera);
}

// ============================================================
// 起動
// ============================================================
startBtn.addEventListener('click', startGame);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); startGame(); } });
initAuth();

addEventListener('beforeunload', () => { saveLocal(); if (PLAYER_ID) remove(ref(db, 'players/' + PLAYER_ID)); });
addEventListener('pagehide', () => { saveLocal(); if (PLAYER_ID) remove(ref(db, 'players/' + PLAYER_ID)); });
</script>
